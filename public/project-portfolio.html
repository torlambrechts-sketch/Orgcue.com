    if(p[0]==="follow"){var i=tk.fol.indexOf(ME);if(i<0)tk.fol.push(ME);else tk.fol.splice(i,1);drawerAfter(i<0?"You follow this task":"You stopped following");return}

  var H=T+rows.length*RH+10;for(var w=0;w<=days;w+=7){var d=dAdd(start,w);s+='<line class="gl" x1="'+X(d)+'" x2="'+X(d)+'" y1="'+(T-8)+'" y2="'+H+'"/>'+(w%14===0?'<text x="'+X(d)+'" y="20" text-anchor="middle">'+dFmt(d)+'</text>':'')}
  rows.forEach(function(r,i){var y=T+i*RH;if(r.h){s+='<rect x="0" y="'+y+'" width="'+W+'" height="'+RH+'" class="tl-g"/><text x="10" y="'+(y+19)+'" class="tl-gt">'+esc(r.h)+'</text>';return}
    var t=r.t,x1=X(t.sd),x2=Math.max(X(t.dd),x1+6);pos[t.id]={x1:x1,x2:x2,y:y+RH/2};
    s+='<text x="20" y="'+(y+19)+'" class="tl-n">'+esc(t.n.length>32?t.n.slice(0,31)+"…":t.n)+'</text><g class="tl-bar" data-wk="'+t.id+'" role="button" tabindex="0" aria-label="'+esc(t.n)+'"><rect x="'+x1+'" y="'+(y+7)+'" width="'+(x2-x1)+'" height="16" rx="4" fill="'+(t.st==="Done"?"#46b82e":isOverdue(t)?"#d2394f":t.st==="In progress"?"#2f7be8":"#a98de6")+'"/><title>'+esc(t.n)+': '+dFmt(t.sd)+' to '+dFmt(t.dd)+' · '+sname(t.o)+'</title></g>'});
  list.forEach(function(o){o.t.deps.forEach(function(d){var a=pos[d],b=pos[o.t.id];if(!a||!b)return;var late=a.x2>b.x1+1;s+='<path d="M'+a.x2+' '+a.y+' C'+(a.x2+18)+' '+a.y+' '+(b.x1-18)+' '+b.y+' '+b.x1+' '+b.y+'" class="tl-dep'+(late?' late':'')+'" marker-end="url(#tlarw'+(late?'r':'')+')"/>'})});
  s+='<line x1="'+X(tISO())+'" x2="'+X(tISO())+'" y1="'+(T-8)+'" y2="'+H+'" stroke="#e255c9" stroke-width="2"/>';
  return '<section class="card"><div class="chart tl" style="overflow-x:auto"><div style="min-width:900px"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Task timeline with dependencies"><defs><marker id="tlarw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7c4ddb"/></marker><marker id="tlarwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#d2394f"/></marker></defs>'+s+'</svg></div></div>'+
    '<div class="legend" style="justify-content:center;padding-bottom:12px"><span><i style="background:#a98de6"></i>Not started</span><span><i style="background:#2f7be8"></i>In progress</span><span><i style="background:#46b82e"></i>Done</span><span><i style="background:#d2394f"></i>Overdue</span><span><i style="background:#7c4ddb;height:2px"></i>Waits on</span><span><i style="background:#e255c9;width:3px"></i>Today</span><span>8 weeks back to 16 weeks ahead</span></div></section>'}
function taskCalendar(list){var off=ST.wkMonth||0,b=new Date(TODAY.getFullYear(),TODAY.getMonth()+off,1),y=b.getFullYear(),m=b.getMonth(),sd=(b.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),tot=Math.ceil((sd+dim)/7)*7,h="";
  for(var k=0;k<tot;k++){var d=k-sd+1,inM=d>=1&&d<=dim,iso=inM?dISO(new Date(y,m,d)):"",ev=inM?list.filter(function(o){return o.t.dd===iso}):[];

  return '<div class="cal-bar"><button class="icon-btn" data-ui="wkmonth:-1" aria-label="Previous month">'+icon("chevl")+'</button><button class="icon-btn" data-ui="wkmonth:1" aria-label="Next month">'+icon("chevr")+'</button><h3>'+b.toLocaleDateString("en-GB",{month:"long",year:"numeric"})+'</h3><button class="btn ghost" data-ui="wkmonth:0">Today</button></div><div class="cal">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(n){return '<div class="cal-h">'+n+'</div>'}).join("")+h+'</div>'}
function workload(list){var cap=+(ST.wkCap||6),start=dAdd(tISO(),-((TODAY.getDay()+6)%7)),weeks=[0,1,2,3,4,5,6,7].map(function(i){return dAdd(start,i*7)}),people=[];
  list.forEach(function(o){if(o.t.st!=="Done"&&people.indexOf(o.t.o)<0)people.push(o.t.o)});people.sort(function(a,b){return sname(a)<sname(b)?-1:1});
  var load=function(p,w){var we=dAdd(w,6),h=0,items=[];list.forEach(function(o){var t=o.t;if(t.o!==p||t.st==="Done")return;var len=Math.max(1,dDiff(t.dd,t.sd)+1),ov=Math.min(dDiff(t.dd,w),6)-Math.max(dDiff(t.sd,w),0)+1;if(ov>0){h+=t.est*ov/len;items.push(t.n)}});return [Math.round(h),items]};
  var rows=people.map(function(p){var cells=weeks.map(function(w){var l=load(p,w),pc=l[0]/cap;return '<td class="hm-c wl'+(l[0]?'':' hm-n')+'" style="'+(l[0]?'background:'+(pc>1?'#f8c4c4':pc>.8?'#fde9a8':'#c8efb3'):'')+'" title="'+esc(l[1].join(", ")||"Nothing planned")+'"><button class="wl-b" data-ui="wlcell:'+p+':'+w+'" aria-label="'+esc(sname(p))+', week of '+dFmt(w)+': '+l[0]+' hours">'+(l[0]?l[0]+' h':'–')+'</button></td>'}).join("");
    return '<tr><td><div class="person">'+av(p)+'<div>'+sname(p)+'<small>'+list.filter(function(o){return o.t.o===p&&o.t.st!=="Done"}).length+' open tasks</small></div></div></td>'+cells+'</tr>'}).join("");
  var sel2=ST.wlSel?ST.wlSel.split("|"):null,detail="";
  if(sel2){var pl=list.filter(function(o){var t=o.t;return t.o===sel2[0]&&t.st!=="Done"&&t.sd<=dAdd(sel2[1],6)&&t.dd>=sel2[1]});detail='<h2 class="st-h2">'+sname(sel2[0])+', week of '+dFmt(sel2[1])+'</h2>'+taskTableHtml(pl,{init:1},"none")+'<p class="amb-s" style="margin-top:8px">Reassign or move a task in its panel to rebalance the week.</p>'}
  return '<div class="toolbar"><label class="chiplabel">Portfolio hours per person each week '+sel("wkCap",[["4","4 h"],["6","6 h"],["8","8 h"],["16","16 h"],["32","32 h"]],String(cap),"sm")+'</label><span class="chiplabel">Each estimate is spread evenly from its start date to its due date.</span></div>'+
    '<section class="card"><div class="tbl-wrap"><table class="hm" style="min-width:900px"><thead><tr><th>Person</th>'+weeks.map(function(w,i){return '<th class="hm-c">'+(i===0?'This week':'w/c '+dFmt(w))+'</th>'}).join("")+'</tr></thead><tbody>'+rows+'</tbody></table></div></section>'+
    '<div class="legend" style="margin-top:10px"><span><i style="background:#c8efb3"></i>Under 80% of capacity</span><span><i style="background:#fde9a8"></i>80 to 100%</span><span><i style="background:#f8c4c4"></i>Over capacity</span><span>Click a cell to see the tasks behind it.</span></div>'+detail}

function wkTaskNew(forMe,initId){if(!INIT.length){toast("Add an initiative first: tasks belong to an initiative");return}var opts=INIT.map(function(x){return [x.id,x.n]});openForm({title:forMe?"Add a task for me":"Add task",fields:[{k:"n",l:"Task",req:1,full:1},{k:"x",l:"Initiative",t:"select",o:opts,v:initId||ST.initSel||INIT[0].id},{k:"o",l:"Assignee",t:"select",o:personOpts(),v:forMe?ME:"ML"},{k:"dd",l:"Due",t:"date",v:dAdd(tISO(),7),req:1},{k:"pri",l:"Priority",t:"select",o:["Urgent","High","Normal","Low"],v:"Normal"},{k:"est",l:"Estimate (hours)",t:"number",min:0,v:"8"}],submit:"Add task",done:"Task added",
  save:function(v){var x=initById(v.x),n=x.tasks.length+1;while(x.tasks.some(function(t){return t.id===x.id+"-"+n}))n++;var t={id:x.id+"-"+n,n:v.n,o:v.o,dd:v.dd,sd:dAdd(v.dd,-7)<tISO()?tISO():dAdd(v.dd,-7),due:qOf(v.dd),st:"Not started",pri:v.pri,est:+v.est||0,subs:[],deps:[],com:[],fol:[ME],desc:"",act:[{who:ME,when:tISO(),what:"created the task"}]};
    if(t.sd>t.dd)t.sd=t.dd;x.tasks.push(t);feed("added “"+t.n+"”","task:"+t.id,x.n);if(v.o!==ME&&ruleOn("R1")){rlog("R1","Notified "+sname(v.o)+" about “"+t.n+"”")}}})}
function writeSU(tg,pre){var isPg=tg.indexOf("PG")===0,nm=isPg?progById(tg).n+" programme":initById(tg).n,last=lastSU(tg);var since=last?last.when:dAdd(tISO(),-14),scope=isPg?progInits(tg):[initById(tg)],dn=0,odn=0;scope.forEach(function(x){(x.tasks||[]).forEach(function(t){if(t.st==="Done"&&t.act.some(function(a){return a.when>=since&&/Done|completed/.test(a.what)}))dn++;if(isOverdue(t))odn++})});
  openForm({title:"Status update: "+nm,intro:"Since "+(last?"the last update on "+dFmt(last.when,1):"two weeks ago")+": "+dn+" task"+(dn===1?"":"s")+" completed and "+odn+" overdue. Pick a status, write a one-line summary, then add highlights, blockers and next steps, one per line.",
  fields:[{k:"st",l:"Status",t:"select",o:[["on","On track"],["risk","At risk"],["off","Off track"]],v:pre?pre.st:last?last.st:"on"},{k:"sum",l:"Summary",t:"textarea",req:1,v:pre?pre.sum:""},{k:"hi",l:"Highlights",t:"textarea",v:pre?pre.hi.join("\n"):""},{k:"bl",l:"Blockers",t:"textarea",v:pre?pre.bl.join("\n"):""},{k:"nx",l:"Next steps",t:"textarea",v:pre?pre.nx.join("\n"):""}],submit:"Post update",done:"Status update posted",
  save:function(v){var lines=function(s){return (s||"").split("\n").map(function(l){return l.trim()}).filter(Boolean)};SU.push({id:"SU"+Date.now(),tg:tg,st:v.st,who:ME,when:tISO(),sum:v.sum,hi:lines(v.hi),bl:lines(v.bl),nx:lines(v.nx),com:[]});
    if(!isPg){var x=initById(tg);x.st={on:"On track",risk:"At risk",off:"Off track"}[v.st]}feed("posted an "+SUL[v.st][0]+" update","init:"+tg,nm);
    if(v.st==="off"&&ruleOn("R6")){var n=RAID.filter(function(r){return r[1]==="Issue"}).length+1,ref="I-"+(n<10?"00":"0")+n;RAID.push([ref,"Issue",nm+": off track – "+v.sum.slice(0,60),isPg?PK[0]:(PK[initById(tg).proj]||PK[0]),isPg?progById(tg).lead:initById(tg).o,"High","Open","Within 2 weeks"]);if(!isPg)RAID_INIT[ref]=tg;rlog("R6","Logged "+ref+" for "+nm);toast("Rule: logged "+ref+" in the RAID log")}}})}
function pmBaseGateMove(id,dir){var x=initById(id),i=STAGES.indexOf(x.stg),to=STAGES[i+(dir==="next"?1:-1)];if(!to)return;
  openForm({title:(dir==="next"?"Approve: ":"Send back: ")+x.n,intro:(dir==="next"?"Gate question for "+to+": "+STAGE_GATE[x.stg]:"It returns to "+to+"."),fields:[{k:"by",l:"Decision by",t:"select",o:personOpts(),v:"DM"},{k:"c",l:"Reason or conditions",t:"textarea",req:dir!=="next"}],submit:dir==="next"?"Approve to "+to:"Send back",done:x.n+" moved to "+to,
    save:function(v){x.stg=to;if(to==="Delivery"&&x.st==="Planned")x.st="On track";(x.gl=x.gl||[]).push({to:to,by:v.by,when:tISO(),c:v.c});logDecision({t:(dir==="next"?"Approve ":"Send back ")+x.n+" to "+to,src:"Stage gate",ref:"init:"+x.id,prop:x.o,st:dir==="next"?"Approved":"Sent back",by:v.by,when:tISO(),why:v.c||"Gate question answered: "+STAGE_GATE[STAGES[i]]});feed((dir==="next"?"approved ":"sent back ")+x.n+" to "+to,"init:"+x.id,x.n,v.by)}})}
function openRef(ref){var p=ref.split(":");if(p[0]==="task"){if(taskById(p[1]))drawerOpen(p[1]);else toast("That task no longer exists")}else if(p[0]==="init"){ST.initSel=p[1];go("st-init")}else if(p[0]==="kpi"){go("st-kpis");openKpi(p[1])}else if(p[0]==="go")go(p[1]);else go(p[0])}
function wkUi(p){
  if(p[0]==="ibk"){ST.ibK=p[1];rerender();return true}
  if(p[0]==="pcst"){var fl=ST.flt[ST.route]=ST.flt[ST.route]||{};fl.Status=fl.Status&&fl.Status[0]===p[1]?[]:[p[1]];rerender();return true}
  if(p[0]==="openinbox"){ST.myTab="inbox";closePop();go("wk-my");return true}
  if(p[0]==="ifollow"){var xf=initById(p[1]),fi=xf.fol.indexOf(ME);if(fi<0)xf.fol.push(ME);else xf.fol.splice(fi,1);rerender();toast(fi<0?"You follow "+xf.n:"You stopped following "+xf.n);return true}
  if(p[0]==="wkpre"){ST.wkPreset=p[1];rerender();return true}
  if(p[0]==="wkmonth"){ST.wkMonth=p[1]==="0"?0:(ST.wkMonth||0)+(+p[1]);rerender();return true}
  if(p[0]==="wlcell"){ST.wlSel=p[1]+"|"+p[2];rerender();return true}
  if(p[0]==="runrules"){var n=runTimeRules();rerender();toast(ruleOn("R5")?n+" overdue task"+(n===1?"":"s")+" updated":"Switch on rule R5 to check overdue tasks");return true}
  if(p[0]==="writesu"){writeSU(p[1]);return true}
  if(p[0]==="reqsu"){var x=initById(p[1]);feed("asked for a status update","init:"+x.id,x.n);toast("Asked "+sname(x.o)+" for an update");return true}
  if(p[0]==="sureply"){var u=SU.filter(function(s){return s.id===p[1]})[0],inp=$("#suc-"+p[1]);if(!u||!inp||!inp.value.trim()){if(inp)inp.focus();return true}u.com.push({who:ME,when:tISO(),text:inp.value.trim()});feed("replied to an update","init:"+u.tg,(initById(u.tg)||progById(u.tg)||{}).n);rerender();toast("Reply posted");return true}
  if(p[0]==="gate"){gateMove(p[1],p[2]);return true}
  if(p[0]==="inboxread"){INBOX.forEach(function(n){n.read=true});ST.notifRead=true;rerender();toast("All caught up");return true}
  if(p[0]==="inboxtoggle"){var n=INBOX[+p[1]];n.read=!n.read;rerender();return true}
  if(p[0]==="inboxdel"){INBOX.splice(+p[1],1);rerender();toast("Archived");return true}
  if(p[0]==="inboxopen"){var m=INBOX[+p[1]];m.read=true;closePop();openRef(m.ref);rerender();return true}
  if(p[0]==="openref"){closePop();openRef(p.slice(1).join(":"));return true}
  return false}

var TOL={on:15,risk:30};
function yearFrac(){var y=TODAY.getFullYear(),s=new Date(y-1,11,31),e=new Date(y,11,31);return Math.max(0,Math.min(1,(TODAY-s)/(e-s)))}
function progOf(b,a,t){b=+b;a=+a;t=+t;if(t===b)return 100;return Math.round((a-b)/(t-b)*100)}
function calcSt(b,a,t){var p=progOf(b,a,t),exp=Math.round(yearFrac()*100);if(p>=100)return "on";var d=exp-p;return d<=TOL.on?"on":d<=TOL.risk?"risk":"off"}

/* ---------- small helpers ---------- */
function sgR1(v){return Math.round(v*10)/10}
function sgClamp(v){return Math.max(0,Math.min(100,v))}
function sgPIdx(p){var s=String(p||"").split(" "),m=SG_MON.indexOf(s[0]);return m<0?-1:(+s[1])*12+m}
function sgPLbl(i){return SG_MON[i%12]+" "+Math.floor(i/12)}
function sgNowIdx(){return TODAY.getFullYear()*12+TODAY.getMonth()}
function sgWd(y,m,n){var c=0,last=null;for(var d=1;d<=31;d++){var dt=new Date(y,m,d);if(dt.getMonth()!==m)break;var w=dt.getDay();if(w>0&&w<6){c++;last=dt;if(c===n)return dt}}return last}
function sgWdI(i,n){return sgWd(Math.floor(i/12),i%12,n)}
function sgNth(y,m,n,dow){var d;if(n>=5){d=new Date(y,m+1,0);while(d.getDay()!==dow)d.setDate(d.getDate()-1);return d}d=new Date(y,m,1);while(d.getDay()!==dow)d.setDate(d.getDate()+1);d.setDate(d.getDate()+7*(n-1));return d}
function sgQName(endIdx){return "Q"+(Math.floor((endIdx%12)/3)+1)+" "+Math.floor(endIdx/12)}
function sgDate(d){return d?d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}):"–"}
function sgOwnerOpts(){return personOpts()}

function sgCheckWhen(p){var i=sgPIdx(p)+1,d=sgWd(Math.floor(i/12),i%12,3);return dISO(d)}
function sgNormUnits(){sgRecalc()}
function sgRecalc(){(SG2_UOBJ||[]).forEach(function(uo){uo.ms.forEach(function(m){m.st=m.ovr||calcSt(m.b,m.a,m.tg["2024"])})})}
function sgUos(unit){return SG2_UOBJ.filter(function(u){return !unit||u.unit===unit})}
function sgUoById(id){return SG2_UOBJ.filter(function(u){return u.id===id})[0]}
function sgMById(id){var r=null;SG2_UOBJ.forEach(function(uo){uo.ms.forEach(function(m){if(m.id===id)r={m:m,uo:uo}})});return r}
function sgMProg(m){return sgClamp(progOf(m.b,m.a,m.tg["2024"]))}
function sgUoProg(uo){if(!uo.ms.length)return null;return Math.round(uo.ms.reduce(function(s,m){return s+sgMProg(m)},0)/uo.ms.length)}
function sgUoSt(uo){var p=sgUoProg(uo);return p==null?null:calcSt(0,p,100)}
/* health 0-100 for the heat map: 85 is exactly on plan; every point behind plan takes one off */
function sgHealth(p){return sgClamp(Math.round(85-(Math.round(yearFrac()*100)-p)))}
function sgUoHealth(uo){var p=sgUoProg(uo);return p==null?null:sgHealth(p)}
function sgUnitOfTeam(team){var u=null;ORG.kids.forEach(function(d){d.teams.forEach(function(t){if(t[0]===team)u=d.n})});return u}
function sgRollup(oid){var l=SG2_UOBJ.filter(function(u){return u.par===oid&&u.ms.length}),sw=0,s=0;l.forEach(function(u){var w=+u.w||0;sw+=w;s+=w*sgUoProg(u)});return {list:l,w:sw,p:sw?Math.round(s/sw):null}}
function sgWeightUsed(oid,except){return SG2_UOBJ.filter(function(u){return u.par===oid&&u.id!==except}).reduce(function(s,u){return s+(+u.w||0)},0)}
function sgStPill(st){return st?opill({st:st}):'<span class="pill mute">No measures</span>'}

function sgCellHealth(oid,unit){var l=(SG2_UOBJ||[]).filter(function(u){return u.par===oid&&u.unit===unit&&u.ms.length});if(!l.length)return null;var sw=0,s=0;l.forEach(function(u){var w=+u.w||1;sw+=w;s+=w*sgUoHealth(u)});return Math.round(s/sw)}
function sgHeatV(oid){var base=HEATV[oid]||[];return UNITS.map(function(u,i){var h=sgCellHealth(oid,u);return h!=null?h:(base[i]==null?null:base[i])})}

  if(m.freq==="Quarterly"){np=li+1;while(np%12%3!==2)np++;due=sgWdI(np+1,SG2_CAD.qWd)}else{np=li+1;due=sgWdI(np+1,SG2_CAD.mWd)}
  var dd=dISO(due),days=dDiff(tISO(),dd);return {last:h,np:sgPLbl(np),due:dd,od:days>0,days:days}}
function sgAllMeasures(){var a=[];KPIS.forEach(function(k){a.push({kind:"kpi",id:k.id,n:k.n,own:k.own,freq:k.freq,m:k,where:"Company · "+k.obj})});
  SG2_UOBJ.forEach(function(uo){uo.ms.forEach(function(m){a.push({kind:"um",id:m.id,n:m.n,own:m.own,freq:m.freq,m:m,where:uo.unit+" · "+uo.id})})});
  a.forEach(function(x){var d=sgDueOf(x.m);x.due=d.due;x.od=d.od;x.days=d.days;x.np=d.np;x.last=d.last});return a}
function sgCheckBtn(x,cls){return '<button class="btn '+(cls||'ghost')+' sm-b" data-ui="'+(x.kind==="kpi"?'kcheck':'sgucheck')+':'+x.id+'">Check in</button>'}

function viewSgUnits(){if(!UNITS.length)return stEmpty("st-units","No business units yet. Each unit\u2019s objectives and measures, and how they roll up, appear here.");var unit=sgUnit(),tab=ST.sgUTab||"card",uos=sgUos(unit),ms=[];uos.forEach(function(u){ms=ms.concat(u.ms)});

    '<div class="kc"><div class="l">Check-ins overdue</div><div class="v'+(ods.length?' bad':'')+'">'+ods.length+'</div><div class="amb-s">'+(ods.length?'older than their frequency allows':'every measure is up to date')+'</div></div>'+
    '<div class="kc"><div class="l">Unit health</div><div class="v">'+(avgH==null?'–':avgH)+'</div><div class="amb-s">average of its objectives; 85 is on plan</div></div></div>';

function sgUnitCardHtml(unit,uos){

function sgRollupHtml(unit,pars){if(!pars.length)return "";

  var hist=[];uos.forEach(function(u){u.ms.forEach(function(m){(m.hist||[]).forEach(function(e){hist.push({e:e,m:m})})})});hist.sort(function(a,b){return a.e.when<b.e.when?1:-1});

    '<section class="card"><div class="card-h"><h2>Check-in history</h2><span class="amb-s">'+hist.length+' recorded</span></div><div class="tbl-wrap"><table style="min-width:560px"><thead><tr><th>Measure</th><th>Period</th><th class="num">Value</th><th>Status</th><th>By</th></tr></thead><tbody>'+
      hist.slice(0,30).map(function(h){var e=h.e;return '<tr data-rec="sgum:'+h.m.id+'" tabindex="0"><td><b>'+esc(h.m.n)+'</b>'+(e.c?'<div class="amb-s">'+esc(e.c)+'</div>':'')+'</td><td>'+esc(e.p)+'<div class="amb-s">'+dFmt(e.when,1)+'</div></td><td class="num">'+(e.t?'–':kFmt(h.m,e.a))+'</td><td>'+(e.t?'<span class="pill mute">Targets changed</span>':opill({st:e.st}))+'</td><td>'+avs([e.by])+'</td></tr>'}).join("")+'</tbody></table></div></section></div>'}

function sgCascadeHtml(){
  var html='<div class="legend" style="margin-bottom:12px"><span>Each company objective, the unit objectives that support it (with their weight) and the team OKRs that deliver them. Team OKRs sit under their unit.</span></div>';
  PERSP.forEach(function(p){var os=OBJ.filter(function(o){return o.p===p[0]}).slice().sort(byId);
    html+='<h2 class="st-h2" style="color:'+p[3]+'">'+p[1]+'</h2><div class="sg-cas-wrap">'+os.map(function(o){
      var uos=SG2_UOBJ.filter(function(u){return u.par===o.id}),okr=OKRS.filter(function(c){return c.obj===o.id}),teams=[];okr.forEach(function(c){c.kids.forEach(function(k){teams.push({k:k,unit:sgUnitOfTeam(k.t),c:c})})});
      var used={},kids=uos.map(function(u){var st=sgUoSt(u),pr=sgUoProg(u),tt=teams.filter(function(t){return t.unit===u.unit&&!used[t.k.t+"|"+u.unit]});tt.forEach(function(t){used[t.k.t+"|"+u.unit]=1});
        return '<div class="sg-cas-u"><div class="sg-cas-n">'+(st?sdot(st):'<i class="sdot" style="background:var(--track)"></i>')+'<div><b>'+esc(u.unit)+' · '+esc(u.n)+'</b><span class="amb-s">'+u.id+' · weight '+u.w+'% · '+(pr==null?'no measures':pr+'% of the way')+'</span></div><button class="link" data-ui="sgunitgo:'+esc(u.unit)+'">Scorecard</button></div>'+
          (tt.length?'<div class="sg-cas-t">'+tt.map(function(t){var pc=okrPct(t.k.kr);return '<button class="sg-cas-k" data-go="st-okr">'+sdot(pctSt(pc))+'<span><b>'+esc(t.k.t)+' OKR</b>'+esc(t.k.o)+'</span><em>'+pc+'%</em></button>'}).join("")+'</div>':'')+'</div>'}).join("");
      var orphan=teams.filter(function(t){return !Object.keys(used).some(function(k){return k.indexOf(t.k.t+"|")===0})});
      if(orphan.length)kids+='<div class="sg-cas-u warn"><div class="sg-cas-n"><i class="sdot" style="background:var(--warn)"></i><div><b>Team OKRs with no unit objective</b><span class="amb-s">Add a unit objective so these roll up through their unit</span></div></div><div class="sg-cas-t">'+orphan.map(function(t){var pc=okrPct(t.k.kr);return '<button class="sg-cas-k" data-go="st-okr">'+sdot(pctSt(pc))+'<span><b>'+esc(t.k.t)+' OKR · '+esc(t.unit||"")+'</b>'+esc(t.k.o)+'</span><em>'+pc+'%</em></button>'}).join("")+'</div></div>';
      var r=sgRollup(o.id);
      return '<section class="card sg-cas"><div class="sg-cas-co">'+sdot(o.st)+'<div style="flex:1;min-width:0"><b>'+o.id+' · '+esc(o.n)+'</b><span class="amb-s">'+esc(o.kpi)+' '+ofmt(o,o.a)+' of '+ofmt(o,o.t)+' · '+oprog(o)+'% of the way'+(r.p!=null?' · units '+r.p+'%':'')+'</span>'+okr.map(function(c){return '<span class="sg-cas-okr">Company OKR: '+esc(c.o)+' · '+okrPct(c.kr)+'%</span>'}).join("")+'</div>'+opill(o)+'</div>'+
        '<div class="sg-cas-kids">'+(kids||'<p class="amb-s" style="padding:4px 0 2px">No unit objective supports this yet.</p>')+'</div></section>'}).join("")+'</div>'});
  return html}

/* ================= 2. STRATEGIC RISKS AND RISK APPETITE ================= */
function sgAppMax(cat){var a=SG2_APP[cat]||"cautious";return +SG2_APP.max[a]}
function sgRes(r){return r.rl*r.ri}
function sgInh(r){return r.il*r.ii}
function sgAbove(r){return sgRes(r)>sgAppMax(r.cat)}
function sgRiskById(id){return SG2_RISKS.filter(function(r){return r.id===id})[0]}
function sgAboveList(){return SG2_RISKS.filter(sgAbove).sort(function(a,b){return (sgRes(b)-sgAppMax(b.cat))-(sgRes(a)-sgAppMax(a.cat))||sgRes(b)-sgRes(a)})}
function sgScCls(s){return s>=15?"sg-s4":s>=10?"sg-s3":s>=5?"sg-s2":"sg-s1"}
function sgSc(s,l,i){return '<span class="sg-sc '+sgScCls(s)+'" title="Likelihood '+l+' × impact '+i+'">'+s+'</span>'}
function sgTrend(t){return '<span class="sg-tr sg-tr-'+t.toLowerCase()+'">'+(t==="Rising"?"↑":t==="Falling"?"↓":"→")+' '+t+'</span>'}
function sgMitOd(r){return r.mit.filter(function(m){return !m.done&&m.due<tISO()})}
function sgStale(r){return dDiff(tISO(),r.rev)>60}
/* the review shows strategic risks above appetite; project RAID items stay one click away */
function sgTopRisksHtml(raid){var l=sgAboveList();
  return '<section class="card pad rv-s"><h3>Top risks <span class="amb-s" style="font-weight:600">· '+l.length+' above appetite</span></h3>'+(l.length?l.slice(0,4).map(function(r){var mx=sgAppMax(r.cat);
    return '<div class="rv-d"><button class="chip sg-rk-chip" data-ui="sgropen:'+r.id+'">'+r.id+'</button><div style="flex:1;min-width:0"><b>'+esc(r.n)+'</b><div style="color:var(--muted);font-size:12px">'+r.cat+' · residual '+sgRes(r)+' against appetite '+mx+' · '+sname(r.o)+' · '+r.tr.toLowerCase()+'</div></div></div>'}).join("")+(l.length>4?'<p class="amb-s" style="margin:8px 0 0">and '+(l.length-4)+' more in the register</p>':''):'<p>Every strategic risk is within appetite.</p>')+
    '<div class="sg-rk-links"><button class="link" data-go="st-risks">Open the risk register</button><button class="link" data-go="raid">Project RAID log'+(raid&&raid.length?' ('+raid.length+' high)':'')+'</button></div></section>'}

function viewSgRisks(){var view=ST.sgRiskView||"res",ab=sgAboveList(),od=0;SG2_RISKS.forEach(function(r){od+=sgMitOd(r).length});
  var tiles='<div class="kpi-row k4"><div class="kc gray"><div class="l">Strategic risks</div><div class="v">'+SG2_RISKS.length+'</div><div class="amb-s">'+SG2_RISKS.filter(function(r){return r.tr==="Rising"}).length+' rising</div></div>'+
    '<div class="kc"><div class="l">Above appetite</div><div class="v'+(ab.length?' bad':'')+'">'+ab.length+'</div><div class="amb-s">residual score over the category limit</div></div>'+
    '<div class="kc"><div class="l">Mitigations overdue</div><div class="v'+(od?' bad':'')+'">'+od+'</div><div class="amb-s">past their due date</div></div>'+
    '<div class="kc"><div class="l">Not reviewed in 60 days</div><div class="v">'+SG2_RISKS.filter(sgStale).length+'</div><div class="amb-s">due a review</div></div></div>';
  var grid='<section class="card"><div class="card-h"><h2>Heat grid</h2>'+tabs("sgRiskView",[["res","Residual"],["inh","Inherent"]],view,"sg-mini-tabs")+'</div><div class="pad">'+sgGridHtml(view)+'</div></section>';
  var app='<section class="card"><div class="card-h"><h2>Risk appetite</h2><button class="btn ghost sm-b" data-ui="sgapp">'+icon("toggles")+'Edit appetite</button></div><div class="tbl-wrap"><table class="sg-app"><thead><tr><th>Category</th><th>Appetite</th><th class="num">Max residual</th><th class="num">Risks</th><th class="num">Above</th></tr></thead><tbody>'+
    SG_CATS.map(function(c){var l=SG2_RISKS.filter(function(r){return r.cat===c}),a=l.filter(sgAbove).length,lv=SG2_APP[c]||"cautious";return '<tr><td><b>'+c+'</b></td><td><span class="sg-lv sg-lv-'+lv+'">'+lv.charAt(0).toUpperCase()+lv.slice(1)+'</span></td><td class="num">'+sgAppMax(c)+'</td><td class="num">'+l.length+'</td><td class="num">'+(a?'<b style="color:var(--bad)">'+a+'</b>':'0')+'</td></tr>'}).join("")+'</tbody></table></div>'+
    '<p class="amb-s pad" style="padding-top:10px">A risk is above appetite when its residual score (likelihood × impact, 1 to 25) is higher than its category allows: averse '+SG2_APP.max.averse+', cautious '+SG2_APP.max.cautious+', open '+SG2_APP.max.open+', hungry '+SG2_APP.max.hungry+'.</p></section>';
  var rows=SG2_RISKS.slice().sort(function(a,b){return sgRes(b)-sgRes(a)}).map(function(r){var above=sgAbove(r),mo=sgMitOd(r),dn=r.mit.filter(function(m){return m.done}).length;
    return '<tr data-rec="sgrisk:'+r.id+'" tabindex="0" data-q="'+esc((r.id+" "+r.n+" "+r.cat+" "+sname(r.o)).toLowerCase())+'"'+ffs({Category:r.cat,Owner:sname(r.o),Appetite:above?"Above appetite":"Within appetite",Trend:r.tr})+'><td class="sg-nw"><b>'+r.id+'</b></td><td><b>'+esc(r.n)+'</b><div class="chips sg-rk-o">'+r.obj.map(function(id){return objById(id)?objChip(id):''}).join("")+'</div></td><td>'+r.cat+'</td><td>'+avs([r.o])+'</td><td>'+sgSc(sgInh(r),r.il,r.ii)+'</td><td>'+sgSc(sgRes(r),r.rl,r.ri)+'</td><td>'+(above?'<span class="pill bad">Above · max '+sgAppMax(r.cat)+'</span>':'<span class="pill good">Within · max '+sgAppMax(r.cat)+'</span>')+'</td><td>'+sgTrend(r.tr)+'</td><td class="sg-nw">'+dn+'/'+r.mit.length+' done'+(mo.length?'<div class="sg-od">'+mo.length+' overdue</div>':'')+'</td><td class="sg-nw">'+dFmt(r.rev,1)+(sgStale(r)?'<div class="sg-od">Review due</div>':'')+'</td></tr>'}).join("");
  var reg='<h2 class="st-h2">Risk register</h2><div class="toolbar">'+liveSearch("Search risks")+'<span class="grow"></span>'+fltBtn()+setBtn()+'</div><section class="card"><div class="tbl-wrap"><table class="live-rows sg-rk-t" style="min-width:1180px"><thead><tr><th>ID</th><th>Risk and objectives</th><th>Category</th><th>Owner</th><th>Inherent</th><th>Residual</th><th>Appetite</th><th>Trend</th><th>Mitigations</th><th>Last review</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'+
    '<div class="legend" style="margin-top:10px"><span>Strategic risks threaten the objectives themselves. Project risks, issues and dependencies stay in the <button class="link" data-go="raid">RAID log</button>.</span></div>';
  return stHead("st-risks",'<button class="btn primary" data-add="sgrisk">'+icon("plus")+'Add risk</button>')+tiles+'<div class="sg-rk-top">'+grid+app+'</div>'+reg}
function sgGridHtml(view){var cell={};SG2_RISKS.forEach(function(r){var l=view==="inh"?r.il:r.rl,i=view==="inh"?r.ii:r.ri;(cell[l+"-"+i]=cell[l+"-"+i]||[]).push(r)});
  var h='<div class="sg-grid" role="table" aria-label="'+(view==="inh"?"Inherent":"Residual")+' risk heat grid"><div class="sg-g-y" aria-hidden="true">Likelihood</div>';

  return h+'<div class="legend" style="margin-top:10px"><span><i class="sg-key above"></i>Above its category appetite</span><span><i style="background:#c8efb3"></i>1–4</span><span><i style="background:#fde9a8"></i>5–9</span><span><i style="background:#fddba3"></i>10–14</span><span><i style="background:#f0a3a3"></i>15–25</span></div>'}

/* ================= PORTFOLIO MODULE (pm): monthly finance, gate criteria and approvers, change requests and baselines, benefit profiles, critical path ================= */
/* Months are indexes from Jan 2024 (0) to Dec 2026 (35). Months before PM_NOWM are closed and hold actuals; later months hold forecasts. All money in £k. */
var PM_NOWM=0,PM_NOWQ=0,PM_MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var PM_FIN={},PM_GATES=null,PM_GS=null,PM_CR=null,PM_BL=null,PM_BEN=null,PM_TLW=false;

/* ---------- small helpers ---------- */
function pmML(m,short){return PM_MN[m%12]+(short?" ’"+(24+Math.floor(m/12)):" "+(2024+Math.floor(m/12)))}
function pmQL(i){return QTR[i]||("Q"+(i%4+1)+" "+(2024+Math.floor(i/4)))}
function pmQS(i){return "Q"+(i%4+1)+" ’"+(24+Math.floor(i/4))}
function pmK(v){v=Math.round(+v||0);return (v<0?"−£":"£")+Math.abs(v).toLocaleString("en-GB")+"k"}
function pmKs(v){v=Math.round(+v||0);return (v>0?"+":v<0?"−":"")+"£"+Math.abs(v).toLocaleString("en-GB")+"k"}
function pmSum(a,from,to){var s=0;for(var i=from;i<=to;i++)s+=+a[i]||0;return s}
function pmZ(n){var a=[];for(var i=0;i<(n||36);i++)a.push(0);return a}
function pmSpread(total,m0,m1,salt){var a=pmZ();total=Math.round(+total||0);if(m1<m0||total<=0)return a;var n=m1-m0+1,w=[],sw=0,i;
  for(i=0;i<n;i++){var v=0.55+Math.sin(Math.PI*(i+0.5)/n)+(salt?0.12*(((i+salt)*7)%5-2)/2:0);w.push(v);sw+=v}
  var acc=0,big=m0;for(i=0;i<n;i++){var x=Math.round(total*w[i]/sw);a[m0+i]=x;acc+=x;if(x>a[big])big=m0+i}a[big]+=total-acc;return a}
function pmDivEnd(h,start){var re=/<div\b|<\/div>/g,d=0,m;re.lastIndex=start;while((m=re.exec(h))){if(m[0]==="</div>"){d--;if(!d)return re.lastIndex}else d++}return -1}
function pmSn(i){return i?sname(i):"No owner"}

/* ---------- monthly finance: budget, actuals, forecast, capex share and commitments per initiative ---------- */
function pmFin(x){var f=PM_FIN[x.id];if(f)return f;
  var cost=+x.cost||0,spent=+x.spent||0,eac=x.eac!=null?+x.eac:cost,bs=x.bs!=null?x.bs:x.s,be=x.be!=null?x.be:x.e,salt=(+String(x.id).replace(/\D/g,"")||1);
  var m0=3*x.s,m1=Math.min(35,3*x.e+2),pe=Math.min(m1,PM_NOWM-1),a=pe>=m0?pmSpread(spent,m0,pe,salt):pmZ();
  if(pe<m0&&spent>0)a[PM_NOWM-1]=Math.round(spent);var fm0=Math.max(m0,PM_NOWM),rem=Math.max(0,Math.round(eac-spent)),fc=fm0<=m1?pmSpread(rem,fm0,m1,salt+2):pmZ();if(fm0>m1&&rem>0)fc[PM_NOWM]=rem;
  f=PM_FIN[x.id]={b:pmSpread(cost,3*bs,Math.min(35,3*be+2),0),a:a,f:fc,cx:0,po:[]};return f}
function pmAct(x){return pmSum(pmFin(x).a,0,PM_NOWM-1)}
function pmFc(x){return pmSum(pmFin(x).f,PM_NOWM,35)}
function pmBudTD(x){return pmSum(pmFin(x).b,0,PM_NOWM-1)}
function pmPhased(x){return pmSum(pmFin(x).b,0,35)}
function pmCommit(x){return pmFin(x).po.reduce(function(s,p){return s+(+p.amt||0)},0)}

function pmAlloc(x){if(x.proj==null||!PROJECTS[x.proj])return null;var nm=PROJECTS[x.proj].name,l=BUD.filter(function(b){return b.proj===nm});return {n:l.length,amt:Math.round(l.reduce(function(s,b){return s+(+b.bud||0)},0)/1000),name:nm}}

  p.bud=x.cost;p.spent=x.spent;p.due=(end.getMonth()+1)+"/"+end.getDate()+"/"+end.getFullYear();p.weeks=wk>0?wk+" weeks":"0 day";
  if(p.status!=="Complete"){p.status=x.st==="Off track"?"Delayed":x.st==="Planned"?"Planned":x.st;p.bs={"On track":"dark","At risk":"over","Off track":"wd"}[x.st]||p.bs}})}

/* ---------- stage gates: criteria, named approvers and a rule per gate ---------- */

function pmGateInfo(x){var G=PM_GATES[x.stg];if(!G)return null;var g=pmGS(x),voted=function(p,d){return g.v.some(function(v){return v.by===p&&(!d||v.dec===d)})};
  var done=G.c.filter(function(c){return g.ck[c]||(g.ex[c]||"").trim()}).length,ok=G.ap.filter(function(p){return voted(p,"Approve")}),rej=G.ap.filter(function(p){return voted(p,"Reject")}),wait=G.ap.filter(function(p){return !voted(p)});
  return {G:G,g:g,done:done,total:G.c.length,critOk:done===G.c.length,ok:ok,rej:rej,wait:wait,need:G.rule==="all"?G.ap.length:1}}

  if(!gi.ok.length&&!gi.rej.length)return "Ready for a decision";return "Waiting for "+gi.wait.map(sname).join(" and ")}

function pmBenSt(b){var t=pmBenTD(b);if(!t[0])return t[1]>0?"On track":"Not started";return t[1]/t[0]>=0.9?"On track":"At risk"}
function pmBenPct(b){var t=pmBenTD(b);return t[0]?Math.round(t[1]/t[0]*100):null}

/* ---------- critical path and slip impact ---------- */
function pmCritical(list){var ids={};list.forEach(function(x){ids[x.id]=x});
  var back=function(x,seen){seen[x.id]=1;var pr=(x.dep||[]).map(function(d){return ids[d]}).filter(function(p){return p&&!seen[p.id]});if(!pr.length)return [x.id];
    pr.sort(function(a,b){return b.e-a.e});return back(pr[0],seen).concat([x.id])};
  var mx=-1;list.forEach(function(x){if(x.e>mx)mx=x.e});var best=[];list.filter(function(x){return x.e===mx}).forEach(function(x){var c=back(x,{});if(c.length>best.length)best=c});return best}
function pmSlip(id,n){var x=initById(id);if(!x)return null;var sh={},q=[id];sh[id]={s:0,e:n};
  while(q.length){var u=initById(q.shift()),du=sh[u.id].e;INIT.forEach(function(d){if((d.dep||[]).indexOf(u.id)<0||d.id===id)return;
    var k=Math.max(0,u.e+du+1-d.s)-Math.max(0,u.e+1-d.s);if(k>0&&(!sh[d.id]||sh[d.id].e<k)){sh[d.id]={s:k,e:k};q.push(d.id)}})}
  var rows=Object.keys(sh).map(function(k){var d=initById(k);return {x:d,s:sh[k].s,e:sh[k].e,ne:d.e+sh[k].e,ns:d.s+sh[k].s,root:k===id}}).filter(function(r){return r.e>0});
  var aff={};rows.forEach(function(r){aff[r.x.id]=r});
  var ms=KPIS.filter(function(k){return INIT.some(function(i){return aff[i.id]&&(i.kpi||[]).some(function(l){return l.k===k.id})})}).map(function(k){
    var late=function(i){return aff[i.id]&&aff[i.id].ne>11},pl=0;INIT.forEach(function(i){(i.kpi||[]).forEach(function(l){if(l.k===k.id&&!late(i))pl+=+l.imp})});
    var g=kGap(k),after=(k.dir<0?g>=0:g<=0)?100:Math.max(0,Math.round(pl/g*100));
    return {k:k,now:kCover(k),after:after,by:kInits(k).filter(function(i){return aff[i.id]})}});
  return {x:x,n:n,sh:sh,rows:rows,ms:ms}}

  var mx=Math.max(1,sb,sf)*1.08,X=function(j){return L+(n<=1?iw/2:iw*j/(n-1))},Y=function(v){return T+ih-v/mx*ih};

  var step=n>24?6:3;for(m=lo;m<=hi;m++)if(m%step===0)s+='<text x="'+X(m-lo).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+pmML(m,1)+'</text>';
  if(PM_NOWM-1>=lo&&PM_NOWM-1<hi){var tx=X(PM_NOWM-1-lo+0.5);s+='<line x1="'+tx.toFixed(1)+'" x2="'+tx.toFixed(1)+'" y1="'+T+'" y2="'+(T+ih)+'" class="pm-today"/><text x="'+(tx+4).toFixed(1)+'" y="'+(T+10)+'" class="pm-tt">Today</text>'}

  if(ap.length)s+='<polyline class="pm-la" points="'+ap.map(function(j){return X(j).toFixed(1)+","+Y(cf[j]).toFixed(1)}).join(" ")+'"/>';
  if(fp.length>1)s+='<polyline class="pm-lf" points="'+fp.map(function(j){return X(j).toFixed(1)+","+Y(cf[j]).toFixed(1)}).join(" ")+'"/>';

  var yb=Y(sb),yf=Y(sf);if(Math.abs(yb-yf)<15){if(yb<yf){yb-=8;yf+=8}else{yb+=8;yf-=8}}
  s+='<text x="'+(W-R+8)+'" y="'+(yb+4).toFixed(1)+'" class="pm-el">Budget '+pmK(sb)+'</text><text x="'+(W-R+8)+'" y="'+(yf+4).toFixed(1)+'" class="pm-el">Forecast '+pmK(sf)+'</text>';
  return '<div class="chart pm-chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(lbl)+': cumulative budget, actual and forecast by month">'+s+'</svg><div class="legend" style="justify-content:center"><span><i class="pm-k-b"></i>Budget</span><span><i class="pm-k-a"></i>Actual</span><span><i class="pm-k-f"></i>Forecast</span><span>Cumulative, £k</span></div></div>'}
function pmBarChart(pl,re,fmt,lbl,afmt,Wd){afmt=afmt||fmt;var W=Wd||560,H=Wd?200:170,L=54,R=8,T=14,B=26,iw=W-L-R,ih=H-T-B,n=12,bw=iw/n,s="",i;

  var on={},edge={},ids=[];if(best){var cur=best;while(cur&&!on[cur.id]){on[cur.id]=1;ids.unshift(cur.id);var p=S[cur.id]&&S[cur.id].p;if(p)edge[p+">"+cur.id]=1;cur=p?by[p]:null}}

function scPeople(){var a=[];PEOPLE.forEach(function(p){if(p.i&&a.indexOf(p.i)<0)a.push(p.i)});for(var k in SNAME)if(a.indexOf(k)<0)a.push(k);return a}

function scRole(id){return SC_ROLES.filter(function(r){return r.id===id})[0]}
function scRoleName(id){var r=scRole(id);return r?r.n:"No role"}
function scNamed(r){var s=0;scPeople().forEach(function(i){var m=SC_PPL[i];if(m&&m.r===r.id)s+=+m.f||0});return s}
function scExtra(r,q){return r.from!=null&&r.from!==""&&q>=+r.from?(+r.x2||0):(+r.x1||0)}
function scCap(r,q,named){return (named!=null?named:scNamed(r))+scExtra(r,q)}
function scCapM(){var m={};SC_ROLES.forEach(function(r){var n=scNamed(r);m[r.id]=QTR.map(function(_,q){return scCap(r,q,n)})});return m}
function scF(v){return String(Math.round(v*10)/10)}
function scK(v){v=Math.round(v);return v>=1000?"£"+(v/1000).toFixed(2)+"M":"£"+v+"k"}
function scKk(v){return "£"+String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,",")+"k"}
function scQ(q){return QTR[q].replace(" 20"," ’")}
function scNowQ(){return Math.floor(NOWQ)}

/* ---------- the plan: live, or a scenario on top of it ---------- */
function scStarted(x){return x.s<NOWQ||x.stg==="Delivery"||x.stg==="Closing"}
function scLiveInc(x){return !(SC_PAUSED[x.id]&&x.stg==="Idea")}
function scRow(x,o){o=o||{};var st=scStarted(x),last=QTR.length-1,lo=st?Math.max(x.s,scNowQ())-x.e:Math.ceil(NOWQ)-x.s,hi=last-x.e;lo=Math.min(0,lo);hi=Math.max(0,hi);

  return {x:x,inc:inc,live:live,st:st,sh:sh,lo:lo,hi:hi,s:st?x.s:x.s+sh,e:x.e+sh,cost:o.cost!=null&&o.cost!==""?+o.cost:+x.cost}}
function scPlan(sc){return INIT.map(function(x){return scRow(x,sc&&sc.it?sc.it[x.id]:null)})}
function scCaps(sc){return sc&&sc.cap?sc.cap:SC_CAP}
function scSpend(plan){var y={};YRS.forEach(function(k){y[k]=0});plan.forEach(function(r){if(!r.inc)return;var n=r.e-r.s+1;for(var q=r.s;q<=r.e;q++){var k=QTR[q].slice(3);if(y[k]!=null)y[k]+=r.cost/n}});return y}
function scLoad(plan){var d={};SC_ROLES.forEach(function(r){d[r.id]=QTR.map(function(){return 0})});

function scUtil(d,c){return c>0?d/c:(d>0?9:0)}
function scCls(d,c){var p=scUtil(d,c);return !d?"sc-z":p>1.001?"sc-o":p>=0.85?"sc-n":"sc-u"}
function scLoadStats(plan){var load=scLoad(plan),cap=scCapM(),over=0,roles={},peak=null;
  SC_ROLES.forEach(function(r){for(var q=scNowQ();q<QTR.length;q++){var d=load[r.id][q],c=cap[r.id][q],p=scUtil(d,c);if(p>1.001){over++;roles[r.id]=1}if(d>0&&(!peak||p>peak.p))peak={r:r,q:q,p:p,d:d,c:c}}});
  return {load:load,cap:cap,over:over,roles:Object.keys(roles).length,peak:peak}}
function scCover(plan){var inc={};plan.forEach(function(r){if(r.inc)inc[r.x.id]=1});
  return KPIS.map(function(k){var pl=0;INIT.forEach(function(x){if(!inc[x.id])return;(x.kpi||[]).forEach(function(l){if(l.k===k.id)pl+=+l.imp})});pl=Math.round(pl*10)/10;
    var g=kGap(k),c=(k.dir<0?g>=0:g<=0)?100:Math.max(0,Math.round(pl/g*100));return {k:k,pl:pl,g:g,c:c}})}
function scBigGap(cov){var out=[];OBJ.forEach(function(o){var c=cov.filter(function(z){return z.k.primary&&z.k.obj===o.id})[0];if(c&&c.c<60)out.push({o:o,c:c.c,k:c.k})});return out}
function scConflicts(plan){var by={},out=[];plan.forEach(function(r){by[r.x.id]=r});
  plan.forEach(function(r){if(!r.inc)return;(r.x.dep||[]).forEach(function(d){var q=by[d];if(!q)return;if(!q.inc)out.push({r:r,d:q,k:"excl"});else if(r.s<=q.e)out.push({r:r,d:q,k:"late"})})});return out}
function scConfText(c){return c.k==="excl"?esc(c.r.x.n)+" depends on "+esc(c.d.x.n)+", which this plan leaves out."
  :c.r.s===c.d.e?esc(c.r.x.n)+" starts in "+QTR[c.r.s]+", the same quarter "+esc(c.d.x.n)+" is due to end.":esc(c.r.x.n)+" starts in "+QTR[c.r.s]+", before "+esc(c.d.x.n)+" ends in "+QTR[c.d.e]+"."}
function scMetrics(sc){var plan=scPlan(sc),sp=scSpend(plan),caps=scCaps(sc),ls=scLoadStats(plan),cov=scCover(plan),big=scBigGap(cov),conf=scConflicts(plan),tot=0,yo=0;
  plan.forEach(function(r){if(r.inc)tot+=r.cost});YRS.forEach(function(y){if(sp[y]>(+caps[y]||0)+0.5)yo++});
  var full=cov.filter(function(c){return c.c>=100}).length,avg=Math.round(cov.reduce(function(a,c){return a+Math.min(100,c.c)},0)/Math.max(1,cov.length));
  return {plan:plan,spend:sp,caps:caps,yo:yo,tot:tot,n:plan.filter(function(r){return r.inc}).length,ls:ls,cov:cov,full:full,avg:avg,big:big,conf:conf}}

/* ---------- scenarios ---------- */
function scById(id){return SC_SCN.filter(function(s){return s.id===id})[0]}
function scCur(){var s=scById(ST.scSel);if(!s&&SC_SCN.length){s=SC_SCN[0];ST.scSel=s.id}return s}
function scNextId(){var n=0;SC_SCN.forEach(function(s){var m=+String(s.id).slice(1);if(m>n)n=m});return "S"+(n+1)}
function scCopyCaps(c){var o={};YRS.forEach(function(y){o[y]=+((c||SC_CAP)[y])||0});return o}
function scDiff(sc){var plan=scPlan(sc),df={shift:[],bud:[],pause:[],running:[],resume:[],caps:[]};
  plan.forEach(function(r){var x=r.x;if(!r.inc){if(r.live){if(r.st)df.running.push(r);else df.pause.push(r)}return}
    if(!r.live)df.resume.push(r);if(r.sh)df.shift.push(r);if(Math.round(r.cost)!==Math.round(+x.cost))df.bud.push(r)});
  YRS.forEach(function(y){var a=+SC_CAP[y]||0,b=+scCaps(sc)[y]||0;if(a!==b)df.caps.push([y,a,b])});
  df.n=df.shift.length+df.bud.length+df.pause.length+df.running.length+df.resume.length+df.caps.length;return df}
function scSetIt(sc,id,k,v){var o=sc.it[id]=sc.it[id]||{};if(v==null)delete o[k];else o[k]=v;if(!Object.keys(o).length)delete sc.it[id]}
function scDiffLines(df){var l=[];
  df.shift.forEach(function(r){l.push(r.x.n+": "+(r.st?"end moves to "+QTR[r.e]:"moves to "+QTR[r.s]+" – "+QTR[r.e])+" ("+(r.sh>0?"+":"−")+Math.abs(r.sh)+" quarter"+(Math.abs(r.sh)===1?"":"s")+")")});
  df.bud.forEach(function(r){l.push(r.x.n+": budget "+scKk(r.x.cost)+" → "+scKk(r.cost))});
  df.pause.forEach(function(r){l.push(r.x.n+": left out, back to Idea with status Planned")});
  df.resume.forEach(function(r){l.push(r.x.n+": back in the plan")});
  df.caps.forEach(function(c){l.push(c[0]+" budget cap: "+scK(c[1])+" → "+scK(c[2]))});
  return l}

  fields:[{k:"n",l:"Name",v:sc?sc.n:"",req:1,full:1},{k:"d",l:"What are you testing?",t:"textarea",v:sc?sc.d:""}].concat(isNew?[{k:"from",l:"Start from",t:"select",full:1,o:[["","The live plan"]].concat(SC_SCN.map(function(s){return [s.id,"A copy of “"+s.n+"”"]})),v:copy?copy.id:""}]:[]),
  submit:isNew?"Create scenario":"Save",done:isNew?"Scenario created":"Scenario saved",

    if(!isNew){sc.n=n;sc.d=v.d;return}
    var src=v.from?scById(v.from):null,s={id:scNextId(),n:n,d:v.d||"",by:ME,when:tISO(),cap:scCopyCaps(src?src.cap:SC_CAP),it:src?JSON.parse(JSON.stringify(src.it||{})):{}};
    SC_SCN.push(s);ST.scSel=s.id;ST.scTab="one";feed("created the scenario “"+n+"”","go:wk-scenarios",n)}})}
function scBudForm(sc,id){var x=initById(id),r=scRow(x,sc.it[id]);openForm({title:"Budget: "+x.n,intro:"Live budget "+scKk(x.cost)+". Spent so far "+scKk(x.spent||0)+".",

  save:function(v){var c=+v.cost;if(isNaN(c)||c<0)return "Enter a budget of 0 or more.";scSetIt(sc,id,"cost",Math.round(c)===Math.round(+x.cost)?null:Math.round(c))}})}
function scCapForm(sc){var c=scCaps(sc);openForm({title:"Yearly budget cap",intro:sc?"For the scenario “"+esc(sc.n)+"”.":"For the live plan.",fields:YRS.map(function(y){return {k:"y"+y,l:y+" (£k)",t:"number",min:0,step:"50",v:c[y],req:1}}),
  submit:"Save caps",done:"Budget caps saved",save:function(v){var o={};for(var i=0;i<YRS.length;i++){var n=+v["y"+YRS[i]];if(isNaN(n)||n<0)return "Enter a cap of 0 or more for "+YRS[i]+".";o[YRS[i]]=Math.round(n)}
    if(sc)sc.cap=o;else SC_CAP=o}})}
function scApplyForm(sc){var df=scDiff(sc);if(!df.n){toast("Nothing to apply: this scenario matches the live plan.");return}
  var li=function(a){return a.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")};
  openForm({title:"Apply “"+sc.n+"” to the live plan?",intro:"These changes go into the live plan for everyone. The decision is logged.",
    html:'<div class="sc-ap full"><ul class="ul">'+li(scDiffLines(df))+'</ul>'+(df.running.length?'<p class="amb-s">Not changed, because the work is already running: '+esc(df.running.map(function(r){return r.x.n}).join(", "))+'. Stop running work at its stage gate.</p>':'')+'</div>',
    fields:[{k:"why",l:"Why (for the decision log)",t:"textarea",v:sc.d||""}],submit:"Apply to live plan",done:"Scenario applied to the live plan",
    save:function(v){scApplyNow(sc,(v.why||"").trim())}})}
function scApplyNow(sc,why){var df=scDiff(sc),lines=scDiffLines(df),now=tISO();
  df.shift.forEach(function(r){var x=r.x;if(!r.st){x.s=r.s;x.ms=(x.ms||[]).map(function(m){return Math.max(0,Math.min(QTR.length-1,m+r.sh))});
      (x.tasks||[]).forEach(function(t){if(t.st==="Not started"&&t.dd){t.dd=dAdd(t.dd,91*r.sh);if(t.sd)t.sd=dAdd(t.sd,91*r.sh);t.due=qOf(t.dd);(t.act=t.act||[]).unshift({who:ME,when:now,what:"moved the dates with the scenario “"+sc.n+"”"})}})}
    else x.ms=(x.ms||[]).map(function(m){return Math.min(m,r.e)});
    x.e=r.e;feed("moved "+x.n+" to "+QTR[x.s]+" – "+QTR[x.e],"init:"+x.id,x.n)});
  df.bud.forEach(function(r){r.x.cost=Math.round(r.cost)});
  df.pause.forEach(function(r){var x=r.x;x.stg="Idea";x.st="Planned";SC_PAUSED[x.id]={sc:sc.id,when:now};
    (x.gl=x.gl||[]).push({to:"Idea",by:ME,when:now,c:"Left out of the plan by the scenario “"+sc.n+"”. Back to Idea until it is approved again."});feed("paused "+x.n,"init:"+x.id,x.n)});
  df.resume.forEach(function(r){delete SC_PAUSED[r.x.id]});
  df.caps.forEach(function(c){SC_CAP[c[0]]=c[2]});
  var d=logDecision({t:"Apply the scenario “"+sc.n+"” to the live plan",src:"Scenario planning",ref:"",prop:sc.by||ME,st:"Approved",by:ME,when:now,why:(why?why+" ":"")+"Changes: "+lines.join("; ")+"."});
  feed("applied the scenario “"+sc.n+"” to the live plan","go:wk-scenarios",sc.n);
  var keep={};df.running.forEach(function(r){keep[r.x.id]={x:1}});sc.it=keep;sc.applied={when:now,by:ME,dec:d.id,n:lines.length}}

/* ---------- Scenarios page ---------- */
function scChips(cur,act,multi){return '<div class="sc-chips">'+SC_SCN.map(function(s){var on=multi?cur.indexOf(s.id)>=0:cur===s.id;return '<button class="chip'+(on?'':' off2')+'" data-ui="'+act+':'+s.id+'" aria-pressed="'+on+'">'+esc(s.n)+'</button>'}).join("")+'</div>'}
function scYearBars(m,live){var mx=1;YRS.forEach(function(y){mx=Math.max(mx,m.spend[y],+m.caps[y]||0,live.spend[y])});mx*=1.08;
  return YRS.map(function(y){var s=m.spend[y],c=+m.caps[y]||0,over=s>c+0.5,ls=live.spend[y];
    return '<div class="sc-yr"><b>'+y+'</b><div class="sc-bar" role="img" aria-label="'+y+': '+scK(s)+' planned against a cap of '+scK(c)+'"><i class="sc-fill'+(over?' over':'')+'" style="width:'+(s/mx*100).toFixed(1)+'%"></i><i class="sc-capm" style="left:'+(c/mx*100).toFixed(1)+'%"></i></div>'+
      '<div class="sc-yt"><b class="'+(over?'sc-bad':'')+'">'+scK(s)+'</b> of '+scK(c)+(over?' · <span class="sc-bad">'+scK(s-c)+' over</span>':' · '+scK(c-s)+' spare')+(Math.round(ls)!==Math.round(s)?'<small>Live plan '+scK(ls)+'</small>':'')+'</div></div>'}).join("")+
    '<div class="legend" style="margin-top:6px"><span><i style="background:var(--accent)"></i>Planned spend, budget spread evenly over each quarter it runs</span><span><i style="background:var(--ink);width:3px"></i>Cap</span></div>'}
function scInitTable(sc,m){var conf={};m.conf.forEach(function(c){conf[c.r.x.id]=1});
  return '<div class="tbl-wrap"><table class="live-rows sc-it" style="min-width:860px"><thead><tr><th style="width:44px">In</th><th>Initiative</th><th>Runs</th><th>Move</th><th class="num">Budget</th><th>Notes</th></tr></thead><tbody>'+m.plan.map(function(r){var x=r.x,o=sc.it[x.id]||{},bch=Math.round(r.cost)!==Math.round(+x.cost),
      runs=QTR[r.s]+' – '+QTR[r.e],was=QTR[x.s]+' – '+QTR[x.e],notes=[];
    if(!r.inc)notes.push('<span class="pill mute">Left out</span>');if(r.inc&&!r.live)notes.push('<span class="pill info">Back in</span>');if(r.inc&&conf[x.id])notes.push('<span class="pill bad">Dependency clash</span>');if(r.st)notes.push('<span class="pill mute" title="Already running: only the end date moves">Running</span>');
    return '<tr class="'+(r.inc?'':'sc-off')+(r.sh||bch||r.inc!==r.live?' sc-chg':'')+'" data-q="'+esc(x.n.toLowerCase())+'"><td><button class="cb'+(r.inc?' on':'')+'" data-ui="scinc:'+sc.id+':'+x.id+'" aria-pressed="'+r.inc+'" aria-label="'+(r.inc?'Leave out ':'Include ')+esc(x.n)+'">'+(r.inc?icon("tick"):'')+'</button></td>'+
      '<td>'+initLink(x)+'<div class="amb-s">'+x.id+' · '+esc(x.stg||"")+' · '+esc(sname(x.o))+'</div></td>'+
      '<td>'+(r.sh?'<s class="amb-s">'+was+'</s><div><b>'+runs+'</b></div>':runs)+'</td>'+
      '<td><span class="sc-sh"><button class="mx" data-ui="scsh:'+sc.id+':'+x.id+':-1" aria-label="Move '+esc(x.n)+' one quarter earlier">'+icon("chevl")+'</button><b>'+(r.sh?(r.sh>0?'+':'−')+Math.abs(r.sh)+' q':'0')+'</b><button class="mx" data-ui="scsh:'+sc.id+':'+x.id+':1" aria-label="Move '+esc(x.n)+' one quarter later">'+icon("chevr")+'</button></span></td>'+
      '<td class="num"><button class="link sc-bud" data-ui="scbud:'+sc.id+':'+x.id+'" aria-label="Change the budget of '+esc(x.n)+'">'+scKk(r.cost)+'</button>'+(bch?'<div class="amb-s">was '+scKk(x.cost)+'</div>':'')+'</td>'+
      '<td><div class="sc-notes">'+notes.join("")+'</div></td></tr>'}).join("")+'</tbody></table></div>'}
function scStrategy(m,live){var rows=m.cov.map(function(c,i){var l=live.cov[i],d=c.c-l.c,cl=covCls(c.c);
    return '<tr class="'+(d?'sc-chg':'')+'"><td><b>'+esc(c.k.n)+'</b><div class="amb-s">'+c.k.obj+' · '+esc((objById(c.k.obj)||{}).n||"")+'</div></td><td class="num">'+kFmt(c.k,Math.abs(c.g))+'</td><td class="num">'+kImp(c.k,c.pl)+'</td><td class="num">'+l.c+'%</td><td class="num"><span class="pill '+cl+'">'+c.c+'%</span></td><td class="num">'+(d?'<span class="sc-d '+(d>0?'up':'down')+'">'+(d>0?'+':'−')+Math.abs(d)+' pts</span>':'<span class="amb-s">–</span>')+'</td></tr>'}).join("");
  var lb={};live.big.forEach(function(b){lb[b.o.id]=1});
  return '<div class="tbl-wrap"><table class="live-rows" style="min-width:700px"><thead><tr><th>Measure</th><th class="num">Gap to 2026 target</th><th class="num">Planned impact</th><th class="num">Live coverage</th><th class="num">Scenario</th><th class="num">Change</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="pad sc-big-gap"><h3>Objectives left with a big gap</h3><p>Less than 60% of the gap to the 2026 target on the headline measure is covered by initiatives in this plan.</p>'+
    (m.big.length?'<div class="sc-bg">'+m.big.map(function(b){return '<button class="sc-o2" data-go="st-map" data-sobj="'+b.o.id+'"><b>'+b.o.id+'</b> '+esc(b.o.n)+' <span class="pill bad">'+b.c+'%</span>'+(lb[b.o.id]?'':'<span class="pill warn">New</span>')+'</button>'}).join("")+'</div>':'<p class="sc-ok">'+icon("check")+'No objective is left with a big gap.</p>')+'</div>'}
function scConfHtml(conf){return conf.length?'<ul class="sc-cf">'+conf.map(function(c){return '<li><span class="pill '+(c.k==="excl"?"warn":"bad")+'">'+(c.k==="excl"?"Left out":"Clash")+'</span><span>'+scConfText(c)+'</span></li>'}).join("")+'</ul>':'<p class="sc-ok pad">'+icon("check")+'No initiative starts before the work it depends on ends.</p>'}
function viewScScenarios(){var tab=ST.scTab||"one",live=scMetrics(null),h=pageHead("Scenarios","Try changes to the plan and see the effect on budget, people and the strategy before you commit.",'<button class="btn ghost" data-go="wk-capacity">'+icon("users")+'Capacity</button><button class="btn primary" data-ui="scnew">'+icon("plus")+'New scenario</button>')+
  tabs("scTab",[["one","Scenario","toggles"],["cmp","Compare","table"]],tab);
  if(!SC_SCN.length)return h+'<section class="card pad sc-empty"><h3>No scenarios yet</h3><p>Start with a copy of the live plan, then leave work out, move it, or change budgets.</p><button class="btn primary" data-ui="scnew">'+icon("plus")+'New scenario</button></section>';
  if(tab==="cmp"){var ids=(ST.scCmp||[]).filter(function(id){return scById(id)}),cols=[["Live plan",live,null]].concat(ids.map(function(id){var s=scById(id);return [s.n,scMetrics(s),s]}));
    var row=function(l,f,dir,sub){return '<tr><th scope="row">'+l+(sub?'<small>'+sub+'</small>':'')+'</th>'+cols.map(function(c,i){var v=f(c[1]),cls="";if(i&&dir){var a=dir.v(c[1]),b=dir.v(live);cls=a===b?"":((a<b)===(dir.lo))?"sc-better":"sc-worse"}return '<td class="'+cls+'">'+v+'</td>'}).join("")+'</tr>'};
    var lo=function(fn){return {v:fn,lo:true}},hi=function(fn){return {v:fn,lo:false}};
    var body='<p class="amb-s" style="margin-bottom:8px">Pick up to three scenarios to compare with the live plan.</p>'+scChips(ids,"sccmp",true)+
      '<section class="card" style="margin-top:14px"><div class="tbl-wrap"><table class="sc-cmp" style="min-width:'+(260+cols.length*190)+'px"><thead><tr><th>Headline</th>'+cols.map(function(c){return '<th>'+esc(c[0])+(c[2]?'<button class="link" data-ui="scopen:'+c[2].id+'">Open</button>':'<small>What is planned today</small>')+'</th>'}).join("")+'</tr></thead><tbody>'+
      row("Initiatives in the plan",function(m){return m.n+' of '+INIT.length})+
      row("Total budget",function(m){return scK(m.tot)})+
      YRS.map(function(y){return row(y+" spend",function(m){var o=m.spend[y]>(+m.caps[y]||0)+0.5;return '<span class="'+(o?'sc-bad':'')+'">'+scK(m.spend[y])+'</span><small>cap '+scK(m.caps[y])+'</small>'},lo(function(m){return Math.max(0,Math.round(m.spend[y]-(+m.caps[y]||0)))}))}).join("")+
      row("Years over the cap",function(m){return m.yo},lo(function(m){return m.yo}))+
      row("Over capacity",function(m){return m.ls.over+' role-quarters'},lo(function(m){return m.ls.over}),"From "+QTR[scNowQ()])+
      row("Busiest role",function(m){return m.ls.peak?esc(m.ls.peak.r.n)+'<small>'+Math.round(m.ls.peak.p*100)+'% in '+QTR[m.ls.peak.q]+'</small>':'–'},lo(function(m){return m.ls.peak?Math.round(m.ls.peak.p*100):0}))+
      row("Measures fully covered",function(m){return m.full+' of '+m.cov.length},hi(function(m){return m.full}),"2026 gap covered by planned impact")+
      row("Average 2026 coverage",function(m){return m.avg+'%'},hi(function(m){return m.avg}))+
      row("Objectives with a big gap",function(m){return m.big.length+(m.big.length?'<small>'+m.big.map(function(b){return b.o.id}).join(", ")+'</small>':'')},lo(function(m){return m.big.length}))+
      row("Dependency conflicts",function(m){return m.conf.length},lo(function(m){return m.conf.length}))+
      '</tbody></table></div></section><div class="legend" style="margin-top:10px"><span><i style="background:var(--good-bg);border:1px solid var(--good)"></i>Better than the live plan</span><span><i style="background:var(--bad-bg);border:1px solid var(--bad)"></i>Worse than the live plan</span></div>';
    return h+body}
  var sc=scCur(),m=scMetrics(sc),df=scDiff(sc),ap=sc.applied;
  var head='<section class="card pad sc-head"><div class="sc-hh"><div><h2>'+esc(sc.n)+'</h2><p>'+esc(sc.d||"")+'</p><div class="amb-s">Created by '+esc(sname(sc.by))+' on '+dFmt(sc.when,1)+' · '+(df.n?df.n+' change'+(df.n===1?'':'s')+' from the live plan':'Same as the live plan')+'</div>'+
    (ap?'<div class="sc-applied">'+icon("check")+'Applied to the live plan on '+dFmt(ap.when,1)+' by '+esc(sname(ap.by))+(ap.dec?' · <button class="link" data-go="wk-decisions">'+esc(ap.dec)+'</button>':'')+'</div>':'')+'</div>'+
    '<div class="sc-ha">'+moreBtn("scm:"+sc.id)+'<button class="btn primary" data-ui="scapply:'+sc.id+'">'+icon("check")+'Apply to live plan</button></div></div></section>';
  var kp='<div class="kpi-row">'+scKc("Total budget",scK(m.tot),scDelta(m.tot,live.tot,scK))+
    scKc("Years over the cap",m.yo+' of '+YRS.length,scDelta(m.yo,live.yo,null,-1),m.yo?"bad":"")+
    scKc("Over capacity",m.ls.over+' <small class="sc-u2">role-quarters</small>',scDelta(m.ls.over,live.ls.over,null,-1),m.ls.over?"bad":"")+
    scKc("Objectives with a big gap",m.big.length,scDelta(m.big.length,live.big.length,null,-1),m.big.length?"bad":"")+
    scKc("Dependency conflicts",m.conf.length,scDelta(m.conf.length,live.conf.length,null,-1),m.conf.length?"bad":"")+'</div>';
  var body=scChips(ST.scSel,"scpick")+head+kp+
    '<section class="card"><div class="card-h sc-ch"><h2>Initiatives</h2><span class="amb-s">Tick to keep in the plan, move by quarters, or click a budget to change it.</span></div>'+scInitTable(sc,m)+'</section>'+
    '<div class="sc-two"><section class="card"><div class="card-h"><h2>Spend per year against the cap</h2><button class="btn ghost sm-b" data-ui="sccap:'+sc.id+'">Change caps</button></div><div class="pad">'+scYearBars(m,live)+'</div></section>'+
    '<section class="card"><div class="card-h"><h2>Dependency conflicts</h2><span class="pill '+(m.conf.length?'bad':'good')+'">'+m.conf.length+'</span></div>'+scConfHtml(m.conf)+'</section></div>'+
    '<section class="card" style="margin-top:18px"><div class="card-h"><h2>Capacity by role</h2>'+scRangeSel()+'</div><div class="pad" style="padding-top:10px">'+scHeat(m.plan,false)+scLegend('<button class="link" data-go="wk-capacity">Change roles and demand</button>')+'</div></section>'+
    '<section class="card" style="margin-top:18px"><div class="card-h sc-ch"><h2>Impact on the strategy</h2><span class="amb-s">Coverage of the 2026 target per measure, from the expected impact of the initiatives in this plan</span></div>'+scStrategy(m,live)+'</section>';
  return h+body}

EXT.ui.push(function(p,el){var k=p[0];if(k.slice(0,2)!=="sc")return false;
  var sc=p[1]?scById(p[1]):null;
  if(k==="sccell"){var v=p[1]+":"+p[2];ST.scCell=ST.scCell===v?"":v;rerender();if(ST.scCell){var d=document.getElementById("scDrill");if(d&&d.scrollIntoView)try{d.scrollIntoView({block:"nearest"})}catch(e){}}return true}
  if(k==="scpick"){if(sc){ST.scSel=sc.id;rerender()}return true}
  if(k==="scopen"){if(sc){ST.scSel=sc.id;ST.scTab="one";rerender()}return true}
  if(k==="sccmp"){var a=(ST.scCmp||[]).filter(function(id){return scById(id)}),i=a.indexOf(p[1]);if(i>=0)a.splice(i,1);else{if(a.length>=3){toast("Compare up to three scenarios at a time.");return true}a.push(p[1])}ST.scCmp=a;rerender();return true}
  if(k==="scnew"){scForm(null);return true}
  if(k==="scren"){if(sc)scForm(sc);return true}
  if(k==="scdup"){if(sc){var c={id:scNextId(),n:sc.n+" (copy)",d:sc.d,by:ME,when:tISO(),cap:scCopyCaps(sc.cap),it:JSON.parse(JSON.stringify(sc.it||{}))};SC_SCN.push(c);ST.scSel=c.id;rerender();toast("Scenario duplicated")}return true}
  if(k==="scdel"){if(sc)openForm({title:"Delete “"+sc.n+"”?",intro:"The live plan does not change.",submit:"Delete scenario",done:"Scenario deleted",save:function(){SC_SCN.splice(SC_SCN.indexOf(sc),1);ST.scCmp=(ST.scCmp||[]).filter(function(id){return id!==sc.id});if(ST.scSel===sc.id)ST.scSel=SC_SCN.length?SC_SCN[0].id:""}});return true}
  if(k==="scinc"){var x=initById(p[2]);if(sc&&x){var r=scRow(x,sc.it[x.id]),inc=!r.inc;scSetIt(sc,x.id,"x",inc===r.live?null:(inc?0:1));rerender();toast((inc?"Included ":"Left out ")+x.n)}return true}
  if(k==="scsh"){var x2=initById(p[2]);if(sc&&x2){var r2=scRow(x2,sc.it[x2.id]),n=r2.sh+(+p[3]);
      if(n<r2.lo||n>r2.hi){toast(+p[3]<0?(r2.st?"It is already running: the end cannot move before "+QTR[Math.max(x2.s,scNowQ())]+".":"It cannot start before "+QTR[Math.ceil(NOWQ)]+"."):"The plan ends in "+QTR[QTR.length-1]+".");return true}
      scSetIt(sc,x2.id,"sh",n||null);rerender()}return true}
  if(k==="scbud"){if(sc&&initById(p[2]))scBudForm(sc,p[2]);return true}
  if(k==="sccap"){if(sc)scCapForm(sc);return true}
  if(k==="scapply"){if(sc)scApplyForm(sc);return true}
  if(k==="scdem"){scDemForm(p[1]);return true}
  if(k==="scrole"){if(scRole(p[1]))scRoleForm(p[1]);return true}
  if(k==="scrolenew"){scRoleForm(null);return true}
  if(k==="scperson"){scPersonForm(p[1]);return true}
  if(k==="scresume"){var x3=initById(p[1]);delete SC_PAUSED[p[1]];rerender();if(x3)toast(x3.n+" is back in the plan");return true}
  return false});

  if(p[0]==="reqsu"){x=initById(p[1]);plAudit("Action","Asked for a status update on “"+(x?x.n:p[1])+"”");return}

/* ---------- Supabase client (lazy) ---------- */
function plEnsure(cb){if(PL.sb||PL.cfgErr){if(cb)cb(PL.cfgErr||null);return}PL.waiters.push(cb);if(PL.loading)return;PL.loading=true;
  if(!/^https?:$/.test(location.protocol)){plEnsureDone("live");return}
  var fin=function(err){plEnsureDone(err)};
  try{fetch("/api/public-config",{cache:"no-store",headers:{Accept:"application/json"}}).then(function(r){if(!r.ok)throw new Error("config");return r.json()}).then(function(c){
    if(!c||!c.url||!c.key)throw new Error("config");PL.cfg={url:c.url};
    plLoadSdk(function(err){if(err){fin("sdk");return}
      try{PL.sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}})}catch(e){fin("sdk");return}
      PL.sb.auth.onAuthStateChange(function(ev,session){var was=PL.user;PL.user=session?session.user:null;
        if(ev==="SIGNED_OUT"&&was&&PL.ws&&!PL.leaving){PL.ready=false;plStatus("signedout");plUnsub()}
        if(ev==="SIGNED_IN"&&!was&&PL.user)setTimeout(function(){plLoadLists()},0);
        plAvatar()});
      PL.sb.auth.getSession().then(function(r){PL.user=r&&r.data&&r.data.session?r.data.session.user:null;fin(null)},function(){fin(null)})})
  }).catch(function(){fin("live")})}catch(e){fin("live")}}
function plEnsureDone(err){PL.loading=false;PL.cfgErr=err==="live"?"live":err==="sdk"?"sdk":"";var w=PL.waiters;PL.waiters=[];w.forEach(function(f){try{if(f)f(PL.cfgErr||null)}catch(e){}})}
function plLoadSdk(cb){if(window.supabase&&window.supabase.createClient){cb(null);return}
  var s=document.createElement("script");s.src=PL_SDK;s.integrity=PL_SRI;s.crossOrigin="anonymous";s.async=true;
  s.onload=function(){cb(window.supabase&&window.supabase.createClient?null:new Error("sdk"))};s.onerror=function(){cb(new Error("sdk"))};document.head.appendChild(s)}
function plNetErr(e){var m=String(e&&(e.message||e)||"");return !e||!e.code&&/fetch|network|load failed|timed? ?out/i.test(m)}
function plErrText(e){var m=String(e&&(e.message||e.msg||e.error_description)||"Something went wrong");
  if(/invalid login credentials/i.test(m))return "That email and password do not match an account.";
  if(/email not confirmed/i.test(m))return "Confirm your email first: open the link we sent you, then sign in.";
  if(/rate limit|too many/i.test(m))return "Too many emails were sent just now. Wait a while, then try again.";
  if(/already registered|already exists/i.test(m))return "An account with this email already exists. Sign in instead.";
  if(/password/i.test(m)&&/(least|short|weak)/i.test(m))return "Choose a longer password (at least 8 characters).";
  if(plNetErr(e))return "You seem to be offline. Try again when you are connected.";
  return m}
function plRedirect(){return location.origin+location.pathname+"#settings-pl-workspace"}

/* ---------- workspaces: lists, open, apply, push, pull ---------- */
function plLoadLists(){if(!PL.sb||!PL.user)return;var uid=PL.user.id;PL.listsAt=Date.now();
  Promise.all([PL.sb.from("workspace_members").select("role,workspaces(id,name,updated_at)").eq("user_id",uid),PL.sb.rpc("my_invites")]).then(function(rs){
    PL.myWs=((rs[0]&&rs[0].data)||[]).filter(function(x){return x.workspaces}).map(function(x){return {id:x.workspaces.id,name:x.workspaces.name,role:x.role,at:x.workspaces.updated_at}});
    PL.myInvites=(rs[1]&&rs[1].data)||[];plRefresh()},function(){})}
function plLoadMembers(cb){if(!PL.ws||!PL.sb)return;var id=PL.ws.id;PL.membersAt=Date.now();
  PL.sb.from("workspace_members").select("user_id,email,name,role,joined_at").eq("workspace_id",id).order("joined_at").then(function(r){if(r.error||!PL.ws||PL.ws.id!==id){if(cb)cb();return}var was=JSON.stringify([PL.members,PL.invites,PL.role]);PL.members=r.data||[];if(cb)cb();
    var fin=function(){if(JSON.stringify([PL.members,PL.invites,PL.role])!==was)plRefresh();else{plChip()}};
    var me=PL.members.filter(function(m){return PL.user&&m.user_id===PL.user.id})[0];if(me&&me.role!==PL.role){PL.role=me.role;plSaveMeta()}
    if(PL.role==="admin")PL.sb.from("workspace_invites").select("email,role,created_at").eq("workspace_id",id).order("created_at").then(function(q){PL.invites=q.error?[]:(q.data||[]);fin()});else{PL.invites=[];fin()}})}
function plMemberName(uid){var m=PL.members.filter(function(x){return x.user_id===uid})[0];return m?(m.name||m.email):"a team member"}
function plOpen(id,fromBoot,done){if(!PL.sb||!PL.user)return;plStatus("connecting");
  PL.sb.from("workspace_members").select("role,workspaces(id,name,version,data,updated_by)").eq("workspace_id",id).eq("user_id",PL.user.id).maybeSingle().then(function(r){
    if(r.error){plStatus("offline");if(!fromBoot)toast(plErrText(r.error));return}
    if(!r.data||!r.data.workspaces){if(PL.ws&&PL.ws.id===id){plToLocal("You no longer have access to “"+PL.ws.name+"”. You are back in the local demo.")}else{plStatus(PL.ws?"saved":"local");toast("That workspace is not available to you")}return}
    var w=r.data.workspaces,m=plMeta(),cur=plRead();
    if(!PL.ws||!m.ws){try{var s0=localStorage.getItem(STORE_KEY);if(s0)localStorage.setItem(plLocalKey(),s0);else localStorage.removeItem(plLocalKey())}catch(e){}}
    PL.ws={id:w.id,name:w.name};PL.role=r.data.role;PL.ready=true;
    if(fromBoot&&m.ws&&m.ws.id===w.id&&PL.hadLocal&&cur){var ck=plKey(cur);
      if(w.version===m.ver){PL.ver=w.version;PL.lastKey=m.key;plSaveMeta();if(ck!==m.key&&plCan("contributor"))plPushNow();else{PL.lastKey=ck;plSaveMeta();plStatus("saved")}}
      else{plApply(w);if(ck!==m.key)toast("Changes you made offline were replaced by newer changes from your team")}}
    else{plApply(w);if(!fromBoot)toast("Opened “"+w.name+"”")}
    PL.members=[];plLoadMembers();plSubscribe();if(done)done();plRefresh()},function(){plStatus("offline")})}
function plApply(w){var cur=plRead()||{},d=w.data||{},out={},k,st={},lst=cur.ST||{},rst=d.ST||{};
  for(k in d)if(k!=="ST")out[k]=d[k];for(k in lst)st[k]=lst[k];PL_SHARED_ST.forEach(function(x){if(x in rst)st[x]=rst[x]});if(lst.wkSeeded)st.wkSeeded=lst.wkSeeded;out.ST=st;
  PL.applying=true;try{localStorage.setItem(STORE_KEY,JSON.stringify(out));if(MODAL)closeModal();reloadFromStorage()}catch(e){}finally{PL.applying=false}
  PL.ver=w.version;var now=plRead();PL.lastKey=now?plKey(now):null;PL.dirty=false;plSaveMeta();plStatus("saved")}
function plSchedule(){if(!PL.ws||!PL.ready||!PL.sb||!PL.user||PL.applying||PL.leaving||!plCan("contributor"))return;clearTimeout(PL.timer);PL.timer=setTimeout(plPushNow,700)}
function plPushNow(){if(!PL.ws||!PL.ready||!PL.sb||!PL.user||PL.leaving)return;if(PL.pushing){PL.again=true;return}
  var cur=plRead();if(!cur)return;var data=plShared(cur),json=JSON.stringify(data),key=plHash(json),ws=PL.ws.id;
  if(key===PL.lastKey){PL.dirty=false;if(PL.status!=="saved")plStatus("saved");return}
  if(!plCan("contributor"))return;
  PL.pushing=true;plStatus("saving");
  PL.sb.rpc("save_workspace",{p_id:ws,p_data:data,p_expected_version:PL.ver}).then(function(r){PL.pushing=false;if(!PL.ws||PL.ws.id!==ws)return;
    if(r.error){PL.dirty=true;plStatus("offline");if(!plNetErr(r.error))toast("Could not save: "+plErrText(r.error));return}
    var res=r.data||{};if(res.ok){PL.ver=res.version;PL.lastKey=key;PL.dirty=false;plSaveMeta();plStatus("saved");if(PL.again){PL.again=false;plSchedule()}}
    else plPull(true)},function(){PL.pushing=false;PL.dirty=true;plStatus("offline")})}
function plPull(conflict){if(!PL.ws||!PL.sb)return;if(MODAL){PL.pendingPull=Math.max(PL.pendingPull,conflict?2:1);return}var ws=PL.ws.id;
  PL.sb.from("workspaces").select("id,name,version,data,updated_by").eq("id",ws).maybeSingle().then(function(r){if(!PL.ws||PL.ws.id!==ws)return;
    if(r.error){plStatus("offline");return}
    if(!r.data){plToLocal("“"+PL.ws.name+"” is no longer available to you. You are back in the local demo.");return}
    var w=r.data;if(w.version<=PL.ver&&!conflict){plStatus("saved");return}
    var before=PL.lastKey;if(w.name!==PL.ws.name)PL.ws.name=w.name;plApply(w);
    if(conflict)toast("Someone else saved first. You now see their latest version: please make your last change again.");
    else if(PL.lastKey!==before){if(PL.user&&w.updated_by===PL.user.id)toast("Updated from your other window");
      else if(PL.members.some(function(m){return m.user_id===w.updated_by}))toast("Updated by "+plMemberName(w.updated_by));
      else plLoadMembers(function(){toast("Updated by "+plMemberName(w.updated_by))})}},function(){plStatus("offline")})}
function plSubscribe(){plUnsub();if(!PL.ws||!PL.sb)return;var id=PL.ws.id;
  try{PL.chan=PL.sb.channel("ws-"+id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"workspaces",filter:"id=eq."+id},function(p){var n=(p&&p.new)||{};
      if(n.version&&n.version<=PL.ver)return;if(PL.pushing&&PL.user&&n.updated_by===PL.user.id)return;plPull(false)}).subscribe(function(s){PL.live=s==="SUBSCRIBED"})}catch(e){PL.live=false}
  clearInterval(PL.poll);PL.poll=setInterval(function(){PL.ticks++;if(!PL.live||PL.dirty||PL.ticks%3===0)plCheck(PL.dirty)},20000)}
function plUnsub(){try{if(PL.chan&&PL.sb)PL.sb.removeChannel(PL.chan)}catch(e){}PL.chan=null;PL.live=false;clearInterval(PL.poll);PL.poll=null}
/* poll: my role and the latest version (used when live updates are not available, and on focus or reconnect) */
function plCheck(pushDirty){if(!PL.ws||!PL.sb||!PL.user)return;var ws=PL.ws.id;
  PL.sb.from("workspace_members").select("role,workspaces(version,updated_by)").eq("workspace_id",ws).eq("user_id",PL.user.id).maybeSingle().then(function(r){if(!PL.ws||PL.ws.id!==ws)return;
    if(r.error){plStatus("offline");return}
    if(!r.data){plToLocal("You no longer have access to “"+PL.ws.name+"”. You are back in the local demo.");return}
    if(r.data.role!==PL.role){PL.role=r.data.role;plSaveMeta();toast("Your role in this workspace is now "+PL_RL[PL.role]);plRefresh()}
    var v=r.data.workspaces&&r.data.workspaces.version;
    if(v>PL.ver){var cur=plRead();if(cur&&plKey(cur)!==PL.lastKey&&plCan("contributor"))plPushNow();else plPull(false)}
    else if(pushDirty||PL.dirty)plPushNow();else if(PL.status==="offline"||PL.status==="connecting")plStatus("saved")},function(){plStatus("offline")})}
function plToLocal(msg){PL.leaving=true;plUnsub();clearTimeout(PL.timer);var b=null;try{b=localStorage.getItem(plLocalKey())}catch(e){}
  try{localStorage.setItem("orgcue-pl-restore",STORE_KEY);if(b)localStorage.setItem(STORE_KEY,b);else localStorage.removeItem(STORE_KEY);localStorage.removeItem(PL_META)}catch(e){}
  try{if(msg)sessionStorage.setItem("orgcue-pl-toast",msg)}catch(e){}
  PL.ws=null;try{location.hash="settings-pl-workspace"}catch(e){}location.reload()}
function plCreate(name){if(!PL.sb||!PL.user)return;PL.busy=true;plSay("Creating “"+name+"”…","info");plRefresh();
  var before=PL_AUDIT.length;plAudit("Members","Created the shared workspace “"+name+"” from the demo data");saveState();
  var data=plShared(plRead()||{});
  PL.sb.rpc("create_workspace",{p_name:name,p_data:data}).then(function(r){PL.busy=false;
    if(r.error||!r.data){if(PL_AUDIT.length>before)PL_AUDIT.shift();plSay(plErrText(r.error),"bad");plRefresh();return}
    plSay("","");plOpen(r.data,false,function(){plLoadLists()})},function(e){PL.busy=false;if(PL_AUDIT.length>before)PL_AUDIT.shift();plSay(plErrText(e),"bad");plRefresh()})}

/* ---------- forms on the workspace page ---------- */
function plVal(f,n){var e=f.querySelector('[name="'+n+'"]');return e?String(e.value||"").trim():""}
function plFormMsg(t,k){var m=$("#plMsg");if(m){m.textContent=t;m.className="pl-msg pl-"+(k||"info")}}
function plForm(kind,f){
  if(kind==="auth"){var em=plVal(f,"email"),pw=(f.querySelector('[name="password"]')||{}).value||"",nm=plVal(f,"name"),up=PL.authTab==="up";PL.email=em;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){plFormMsg("Enter a valid email address.","bad");return}
    if(up&&pw.length<8){plFormMsg("Use at least 8 characters for your password.","bad");return}
    if(!pw){plFormMsg("Enter your password, or use “Email me a sign-in link”.","bad");return}
    plEnsure(function(err){if(err){plFormMsg(plCfgText(),"bad");return}PL.busy=true;plFormMsg(up?"Creating your account…":"Signing in…","info");
      var p=up?PL.sb.auth.signUp({email:em,password:pw,options:{data:{name:nm||em.replace(/@.*/,"")},emailRedirectTo:plRedirect()}}):PL.sb.auth.signInWithPassword({email:em,password:pw});
      p.then(function(r){PL.busy=false;if(r.error){plFormMsg(plErrText(r.error),"bad");return}
        var d=r.data||{};
        if(d.session){PL.user=d.session.user;plAudit("Account",(up?"Created an account and signed in as ":"Signed in as ")+PL.user.email);plSay("","");plLoadLists();toast("Signed in as "+PL.user.email);if(PL.ws)plOpen(PL.ws.id,true);plRefresh();return}
        if(up&&d.user&&d.user.identities&&d.user.identities.length===0){plSay("An account with this email may already exist. Sign in instead, or reset your password.","bad");PL.authTab="in";plRefresh();return}
        plSay("Check your email. We sent a confirmation link to "+em+". Open it, then sign in here.","good");PL.authTab="in";plRefresh()},function(e){PL.busy=false;plFormMsg(plErrText(e),"bad")})});return}
  if(kind==="create"){var n=plVal(f,"name");if(!n){plFormMsg("Give the workspace a name.","bad");return}plCreate(n.slice(0,120));return}
  if(kind==="invite"){if(!plCan("admin")){toast(plDenyMsg("admin"));return}var ie=plVal(f,"email").toLowerCase(),ir=plVal(f,"role")||"contributor";
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(ie)){plFormMsg("Enter a valid email address.","bad");return}
    if(PL.members.some(function(m){return m.email===ie})){plFormMsg(ie+" is already a member.","bad");return}
    plFormMsg("Inviting "+ie+"…","info");
    PL.sb.from("workspace_invites").insert({workspace_id:PL.ws.id,email:ie,role:ir,invited_by:PL.user.id}).then(function(r){
      if(r.error){plFormMsg(r.error.code==="23505"?ie+" is already invited. Cancel that invite to change the role.":plErrText(r.error),"bad");return}plAudit("Members","Invited "+ie+" as "+PL_RL[ir]);plSay("Invited "+ie+". Ask them to sign in at orgcue.com with this email: the workspace will be waiting for them.","good");plLoadMembers();rerender()});return}
}
function plCfgText(){return PL.cfgErr==="live"?"Sign-in needs the live site. Open www.orgcue.com to sign in; this copy works as a local demo.":"Sign-in could not load. Check your connection and try again."}

/* ---------- data-ui actions ---------- */
EXT.ui.push(function(p,el){var k=p[0];
  if(k==="reset"&&PL.ws){toast("Resetting only affects the local demo. Switch back to the local demo first.");return true}
  if(k.indexOf("pl")!==0)return false;
  if(k==="plviewas"){closePop();if(PL.ws){toast("In a shared workspace your role comes from the workspace admin");return true}ST.plViewAs=PL_ROLES.indexOf(p[1])>=0?p[1]:"admin";rerender();toast("Viewing as "+PL_RL[plRole()]+(plRole()==="admin"?"":": blocked actions explain why"));return true}
  if(k==="plauthtab"){PL.authTab=p[1]==="up"?"up":"in";plSay("","");rerender();return true}
  if(k==="plretry"){PL.cfgErr="";rerender();return true}
  if(k==="plgo"){go(p[1]);return true}
  if(k==="plmagic"){var ei=$('#plAuth [name="email"]'),em=ei?ei.value.trim():"";if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){plFormMsg("Enter your email address first.","bad");if(ei)ei.focus();return true}PL.email=em;
    plEnsure(function(err){if(err){plFormMsg(plCfgText(),"bad");return}plFormMsg("Sending a sign-in link…","info");
      PL.sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:plRedirect()}}).then(function(r){if(r.error){plFormMsg(plErrText(r.error),"bad");return}plSay("Check your email. We sent a sign-in link to "+em+".","good");rerender()},function(e){plFormMsg(plErrText(e),"bad")})});return true}
  if(k==="plsignout"){closePop();if(!PL.sb){toast("You are not signed in");return true}var inWs=!!PL.ws;PL.leaving=inWs;
    var fin=function(){if(inWs)plToLocal("Signed out. You are back in the local demo.");else{PL.user=null;PL.myWs=[];PL.myInvites=[];PL.listsAt=0;plSay("","");plAvatar();rerender();toast("Signed out")}};
    PL.sb.auth.signOut().then(fin,fin);return true}
  if(k==="plopen"){if(!PL.user)return true;if(PL.ws&&PL.ws.id===p[1]){toast("You are already in this workspace");return true}plOpen(p[1],false);return true}
  if(k==="pljoin"){if(!PL.user)return true;PL.busy=true;plSay("Joining…","info");rerender();
    PL.sb.rpc("accept_invites").then(function(r){PL.busy=false;if(r.error){plSay(plErrText(r.error),"bad");rerender();return}var j=(r.data||[]).filter(function(x){return x.workspace_id===p[1]})[0]||(r.data||[])[0];
      plSay("","");plLoadLists();if(j)plOpen(j.workspace_id,false,function(){plAudit("Members","Joined the workspace as "+PL_RL[j.role]);rerender()});else{toast("That invite is no longer open");rerender()}},function(e){PL.busy=false;plSay(plErrText(e),"bad");rerender()});return true}
  if(k==="pllocal"){if(!PL.ws)return true;plToLocal("You are back in the local demo. Your shared workspace is still there when you open it again.");return true}
  if(k==="plleave"){if(!PL.ws)return true;var wn=PL.ws.name,alone=PL.members.length<=1;
    openForm({title:"Leave “"+wn+"”?",plNeed:"viewer",plNoLog:true,intro:alone?"You are the only member, so leaving deletes this workspace for good.":"You lose access until an admin invites you again. Your local demo comes back.",submit:alone?"Leave and delete":"Leave workspace",
      save:function(){PL.sb.rpc("leave_workspace",{p_id:PL.ws.id}).then(function(r){if(r.error){toast(plErrText(r.error));return}plToLocal(r.data==="deleted"?"You left and deleted “"+wn+"”.":"You left “"+wn+"”.")},function(e){toast(plErrText(e))})}});return true}
  if(k==="plremove"){var mm=PL.members.filter(function(m){return m.user_id===p[1]})[0];if(!mm)return true;
    openForm({title:"Remove "+(mm.name||mm.email)+"?",plNeed:"admin",plNoLog:true,intro:"They lose access to “"+esc(PL.ws.name)+"” straight away.",submit:"Remove",
