  im.rows.forEach(function(r,ri){var raw={},v={},errs=[],notes=[];T.f.forEach(function(fd){var c=im.map[fd[0]];raw[fd[0]]=c!=null&&c>=0?(r[c]||""):""});
    T.f.forEach(function(fd){if(fd[2]&&!String(raw[fd[0]]).trim())errs.push(fd[1]+" is empty")});
    if(im.target==="tasks"){v.n=raw.n;v.desc=raw.desc;v.key=raw.key;
      var o=plPerson(raw.o);if(o===null){notes.push("“"+raw.o+"” is not in OrgCue: "+(im.unknown==="me"?"assigned to you":"left unassigned"));o=im.unknown==="me"?ME:""}v.o=o;
      v.st=plTaskSt(raw.st);if(v.st===null)errs.push("Status “"+raw.st+"” is not known: use Not started, In progress or Done");
      v.dd=plDate(raw.dd);if(v.dd===null)errs.push("Due date “"+raw.dd+"” is not a date");
      v.pri=plPri(raw.pri);if(v.pri===null)errs.push("Priority “"+raw.pri+"” is not known: use Urgent, High, Normal or Low");
      var est=plNum(raw.est);if(est===null)errs.push("Estimate “"+raw.est+"” is not a number");else{if(im.preset==="jira"&&est!=="")est=Math.round(est/360)/10;v.est=est===""?8:est}}
    else if(im.target==="inits"){v.n=raw.n;v.desc=raw.desc;
      var ow=plPerson(raw.o);if(ow===null||ow===""){if(raw.o)notes.push("“"+raw.o+"” is not in OrgCue: you are the owner");ow=ME}v.o=ow;
      var pg=raw.pg?PROGS.filter(function(x){return x.id.toLowerCase()===raw.pg.toLowerCase()||x.n.toLowerCase()===raw.pg.toLowerCase()})[0]:null;if(raw.pg&&!pg)notes.push("Programme “"+raw.pg+"” not found: added to "+(PROGS[0]||{n:"no programme"}).n);v.pg=(pg||PROGS[0]||{}).id;
      var pr=raw.p?PERSP.filter(function(x){return x[0].toLowerCase()===raw.p.toLowerCase()||x[1].toLowerCase()===raw.p.toLowerCase()||x[2].toLowerCase()===raw.p.toLowerCase()})[0]:null;if(raw.p&&!pr)errs.push("Pillar “"+raw.p+"” is not one of "+PERSP.map(function(x){return x[1]}).join(", "));v.p=(pr||PERSP[0]||[])[0];
      v.s=plQtr(raw.s);if(v.s===null)errs.push("Start “"+raw.s+"” is not a quarter between "+QTR[0]+" and "+QTR[QTR.length-1]);else if(v.s==="")v.s=Math.min(QTR.length-1,Math.ceil(NOWQ));
      v.e=plQtr(raw.e);if(v.e===null)errs.push("End “"+raw.e+"” is not a quarter between "+QTR[0]+" and "+QTR[QTR.length-1]);else if(v.e==="")v.e=v.s===null?null:Math.min(QTR.length-1,v.s+3);
      if(v.s!==null&&v.e!==null&&v.e<v.s)errs.push("The end quarter is before the start quarter");
      var cost=plNum(raw.cost);if(cost===null)errs.push("Budget “"+raw.cost+"” is not a number");v.cost=cost===""||cost===null?0:cost;
      var st=raw.st?["Planned","On track","At risk","Off track"].filter(function(x){return x.toLowerCase()===raw.st.toLowerCase()})[0]:"Planned";if(!st)errs.push("Status “"+raw.st+"” is not known: use Planned, On track, At risk or Off track");v.st=st}
    else{var k=plKpi(raw.k);if(raw.k&&!k)errs.push("Measure “"+raw.k+"” is not in OrgCue");v.k=k?k.id:"";v.kn=k?k.n:raw.k;
      var a=plNum(raw.a);if(a===null||(a===""&&raw.a))errs.push("Value “"+raw.a+"” is not a number");v.a=a;
      v.p=plPeriod(raw.p);if(v.p===null)errs.push("Period “"+raw.p+"” is not a month such as Sep 2024");v.c=raw.c}
    out.push({i:ri+2,raw:raw,v:v,errs:errs,notes:notes})});
  return out}
function plFmtCell(target,k,v){if(target==="tasks"){if(k==="o")return v.o?sname(v.o)||v.o:"Unassigned";if(k==="dd")return v.dd?dFmt(v.dd,1):"";if(k==="est")return v.est+" h"}
  if(target==="inits"){if(k==="o")return sname(v.o)||v.o;if(k==="pg")return (progById(v.pg)||{}).n||v.pg;if(k==="p")return (PERSP.filter(function(x){return x[0]===v.p})[0]||[])[1]||v.p;if(k==="s"||k==="e")return v[k]==null?"":QTR[v[k]]||"";if(k==="cost")return "£"+v.cost+"k"}
  if(target==="kpis"&&k==="k")return v.kn;var x=v[k];return x==null?"":String(x)}

  if(im.target==="tasks"){var x=initById(im.init);if(!x){toast("Choose an initiative first");return}b.init=x.id;
    ok.forEach(function(r){var v=r.v,n=x.tasks.length+1;while(x.tasks.some(function(t){return t.id===x.id+"-"+n}))n++;var dd=v.dd||dAdd(tISO(),14),sd=dAdd(dd,-7)<tISO()?tISO():dAdd(dd,-7);if(sd>dd)sd=dd;

  else if(im.target==="inits"){ok.forEach(function(r){var v=r.v,n=1;while(initById("I"+n))n++;var id="I"+n;
      INIT.push({id:id,n:v.n,p:v.p,obj:[],s:v.s,e:v.e,st:v.st,o:v.o,cost:+v.cost||0,val:6,eff:5,risk:"Medium",proj:null,ms:[v.e],kpi:[],tasks:[],spent:0,desc:v.desc||"",pg:v.pg,stg:v.st==="Planned"?"Idea":"Delivery",bs:v.s,be:v.e,eac:+v.cost||0,dep:[],fol:[ME]});
      b.inits.push(id);feed("imported the initiative “"+v.n+"”","init:"+id,v.n)});text="Imported "+ok.length+" initiative"+(ok.length===1?"":"s")+" from "+b.src}

      feed("checked in "+k.n+" at "+kFmt(k,+v.a),"kpi:"+k.id,k.n)});text="Imported "+ok.length+" measure value"+(ok.length===1?"":"s")+" from "+b.src}
  b.text=text;PL_LASTIMP=b;im.done=b;im.head=[];im.rows=[];im.text="";im.name="";im.map={};plAudit("Import",text+(b.skipped?" ("+b.skipped+" row"+(b.skipped===1?"":"s")+" skipped)":""));rerender();toast(text)}
function plImpUndo(){var b=PL_LASTIMP;if(!b){toast("There is no import to undo");return}var i;
  if(b.tasks.length){var x=initById(b.init);if(x)for(i=x.tasks.length-1;i>=0;i--)if(b.tasks.indexOf(x.tasks[i].id)>=0)x.tasks.splice(i,1)}
  if(b.inits.length)for(i=INIT.length-1;i>=0;i--)if(b.inits.indexOf(INIT[i].id)>=0)INIT.splice(i,1);
  if(b.kpis.length){b.kpis.forEach(function(s){var k=kpiById(s.k);if(!k)return;var cur=k.primary?kObj(k):k;cur.a=s.a;cur.tr=s.tr;if(k.hist)k.hist=k.hist.filter(function(h){return h.imp!==b.id})});recalcStatus()}

function pjObj(row,map){var o={};map.forEach(function(m){var v=row[m[1]];if(v!=null)o[m[0]]=v});return dbUnextra(row,o)}

      out.projects.push(r);
      if(p)(p.team||[]).forEach(function(w,k){out.project_members.push({id:id+":"+k,sort:k,project_id:id,person_id:w})});

/* ================= PORTFOLIO DATA: programmes, initiatives and their tasks, status updates, decisions, actions, requests,
   stages and gates, change requests, baselines, monthly finance, purchase orders and benefits =================
   Every record is a typed row. Lists inside a record are child tables whose ids are built from the parent id.
   A property that does not fit its column type (for example text typed into a number field) is kept in `extra`,
   so the app gets back exactly what it had. */
function pfFit(t,v){if(v==null)return false;if(t==="text")return typeof v==="string";if(t==="int")return typeof v==="number"&&isFinite(v)&&v%1===0;
  if(t==="num")return typeof v==="number"&&isFinite(v);if(t==="bool")return typeof v==="boolean";if(t==="date")return typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v);return true}
/* spec: [property, column, type, referenced table, "a" = always present (null is a value)]; a property path "old.e" reads a nested object */
function pfCols(spec,pre){return (pre||[]).concat(spec.map(function(s){return s[3]?[s[1],s[2],s[3]]:[s[1],s[2]]}))}
function pfSorted(o){var r={};Object.keys(o).sort().forEach(function(k){r[k]=o[k]});return r}
function pfNest(spec){var n={};spec.forEach(function(s){var p=s[0].split(".");if(p.length>1)(n[p[0]]=n[p[0]]||[]).push(p[1])});return n}
/* object -> row. skip: properties stored elsewhere (child tables) or derived. opt: optional child lists (kept as [] in extra when empty) */
function pfRow(o,spec,row,skip,opt){var ex={},n=0,known=(skip||[]).concat(opt||[]),nest=pfNest(spec),whole={},absent=[];
  for(var nk in nest){known.push(nk);var nv=o[nk];if(nv===undefined)continue;
    if(!nv||typeof nv!=="object"||Array.isArray(nv)||Object.keys(nv).some(function(k){return nest[nk].indexOf(k)<0||nv[k]===null})||!Object.keys(nv).some(function(k){return nv[k]!==undefined})){whole[nk]=1;ex[nk]=nv;n++}}
  spec.forEach(function(s){var p=s[0].split("."),v;if(p.length>1){if(whole[p[0]]||o[p[0]]==null)return;v=o[p[0]][p[1]]}else{known.push(s[0]);v=o[s[0]]}
    if(v===undefined){if(s[4]==="a")absent.push(s[0]);return}
    if(v===null){if(s[4]==="a")row[s[1]]=null;else{ex[s[0]]=null;n++}return}
    if(pfFit(s[2],v)&&!(s[3]&&v===""))row[s[1]]=v;else{ex[s[0]]=v;n++}});
  (opt||[]).forEach(function(k){if(Array.isArray(o[k])&&!o[k].length){ex[k]=[];n++}else if(o[k]!==undefined&&!Array.isArray(o[k])){ex[k]=o[k];n++}});
  for(var k in o)if(known.indexOf(k)<0&&o[k]!==undefined){ex[k]=o[k];n++}
  if(absent.length){ex.__absent=absent;n++}
  row.extra=n?pfSorted(ex):null;return row}
/* row -> object */
function pfObj(r,spec,o,noEx){o=o||{};var ab=(r.extra&&r.extra.__absent)||[];
  spec.forEach(function(s){var p=s[0].split("."),v=r[s[1]];
    if(p.length>1){if(v!=null){o[p[0]]=o[p[0]]||{};o[p[0]][p[1]]=v}return}
    if(s[4]==="a"){if(ab.indexOf(s[0])<0)o[s[0]]=v==null?null:v}else if(v!=null)o[s[0]]=v});
  if(!noEx)pfEx(r,o);return o}
function pfEx(r,o){if(r.extra)for(var k in r.extra)if(k.slice(0,2)!=="__")o[k]=r.extra[k];return o}
/* a list of plain values -> child rows; values that do not fit the column go to extra.v */
function pfList(list,pid,pcol,pfx,col,type,start){return (list||[]).map(function(v,i){var r={id:pid+":"+pfx+i,sort:(start||0)+i};r[pcol]=pid;if(pfFit(type,v)&&v!==""){r[col]=v;r.extra=null}else{r[col]=null;r.extra={v:v}}return r})}
function pfVal(r,col){return r.extra&&("v" in r.extra)?r.extra.v:r[col]}
/* rows grouped by parent id, each group in sort order */
function pfGroup(data,t,col){var m={};dbGet(data,t).forEach(function(r){(m[r[col]]=m[r[col]]||[]).push(r)});return m}
function pfHas(data){return data&&("initiatives" in data)}

/* ================= WORK DATA: inbox, activity feed, automation rules, custom fields, saved views, timesheets, current user =================
   Initiative tasks (and the custom-field values on them) belong to the portfolio domain; these tables hold the work data around them.
   Owned globals: INBOX, FEED, RLOG, RULES (on/off), WT_FIELDS, WT_VIEWS, WT_TS, ME.

dbTable("notifications","work",[["recipient_id","text","people"],["kind","text"],["message","text"],["ref","text"],["created_on","date"],["read","bool"]],
  {title:"Notifications",desc:"One item in a person's inbox: a mention, an assignment, a request or a rule message. ref points at what it is about (task:I7-1, init:I2, go:wk-time)."});
dbTable("activity_feed","work",[["actor_id","text","people"],["action","text"],["ref","text"],["title","text"],["created_on","date"]],
  {title:"Activity feed",desc:"One entry of the workspace activity feed: who did what, on which object (ref), newest first."});
dbTable("automation_rules","work",[["trigger_text","text"],["action_text","text"],["enabled","bool"]],
  {title:"Automation rules",desc:"A workspace automation rule and whether it is on. The behaviour of each rule id is built into the app."});
dbTable("rule_runs","work",[["rule_id","text","automation_rules!"],["ran_on","date"],["message","text"]],
  {title:"Rule runs",desc:"One run of an automation rule, newest first, with what it did."});
dbTable("custom_fields","work",[["name","text"],["field_type","text"]],
  {title:"Custom fields",desc:"A custom field every task in the workspace can have (text, number, single select, date or person), in display order."});
dbTable("custom_field_options","work",[["field_id","text","custom_fields!"],["label","text"]],
  {title:"Custom field options",desc:"One option of a single-select custom field, in order."});
dbTable("saved_views","work",[["name","text"],["owner_id","text","people"],["shared","bool"],["view_type","text"],["preset","text"],["programme","text"],["group_by","text"],["search","text"],["filters","jsonb"],["created_on","date"]],
  {title:"Saved task views",desc:"A saved view of the Tasks page: view type, preset, programme, grouping, search and filters; personal or shared with the workspace."});
dbTable("timesheet_weeks","work",[["person_id","text","people"],["week_start","date"],["status","text"],["decided_by","text","people"],["note","text"],["submitted_on","date"],["decided_on","date"]],
  {title:"Timesheet weeks",desc:"One person's timesheet for one week (Monday): draft, submitted, approved or returned. id is person|week."});
