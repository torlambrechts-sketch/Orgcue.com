<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/orgpuls-design-system-d91c81f2-fbc3-4646-b16a-fd3ab94db56a/styles.css">
  <script src="_ds/orgpuls-design-system-d91c81f2-fbc3-4646-b16a-fd3ab94db56a/_ds_bundle.js"></script>
  <script src="oc-kit.js"></script>
  <script src="oc-data.js"></script>
  <style>
    html, body { margin: 0; background: #FCF6E9; color: #191510; font-family: var(--font-sans, 'DM Sans', system-ui, sans-serif); font-size: 14px; }
    a { color: #2F5D2A; text-decoration: none; }
    a:hover { color: #1E3D1A; text-decoration: underline; }
    *:focus-visible { outline: 3px solid #191510; outline-offset: 2px; border-radius: 6px; }
    @keyframes ht-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: var(--op-bg);">
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; background: var(--op-ink); color: var(--op-bg); padding: 7px 16px; font-size: 12.5px;">
    <span style="font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 10.5px; opacity: .8;">Demo controls · dev only</span>
    <span style="display: flex; align-items: center; gap: 6px;">View as
      <span style="display: flex; gap: 2px; border-radius: 9px; background: rgba(252,246,233,.12); padding: 2px;"><sc-for list="{{ roles }}" as="r" hint-placeholder-count="4"><button type="button" onClick="{{ r.on }}" aria-pressed="{{ r.sel }}" style="{{ r.st }}">{{ r.t }}</button></sc-for></span>
    </span>
    <span style="display: flex; align-items: center; gap: 6px;">Phase
      <span style="display: flex; gap: 2px; border-radius: 9px; background: rgba(252,246,233,.12); padding: 2px;"><sc-for list="{{ phases }}" as="p" hint-placeholder-count="6"><button type="button" onClick="{{ p.on }}" aria-pressed="{{ p.sel }}" style="{{ p.st }}">{{ p.t }}</button></sc-for></span>
    </span>
    <button type="button" onClick="{{ toggleAll }}" aria-pressed="{{ all }}" style="display: flex; align-items: center; gap: 8px; border: none; background: transparent; color: var(--op-bg); cursor: pointer; font-family: inherit; font-size: 12.5px;"><span style="{{ allTrack }}"><span style="{{ allKnob }}"></span></span>Show all features</button>
    <span style="margin-left: auto; display: flex; gap: 14px;"><a href="#/phone" onClick="{{ goPhone }}" style="color: var(--op-ac); font-weight: 700;">Phone flow</a><a href="#/customer" onClick="{{ goCustomer }}" style="color: var(--op-ac); font-weight: 700;">Customer page</a></span>
  </div>
  <header style="display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--op-bg);">
    <a href="#/home" onClick="{{ goHome }}" style="display: flex; align-items: center; gap: 10px; color: var(--op-ink); text-decoration: none; flex: none;">
      <span style="display: flex; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: 9px; background: var(--op-ink); color: var(--op-bg); font-family: var(--font-display); font-size: 17px; font-weight: 600;">O</span>
      <span style="font-family: var(--font-display); font-size: 20px; font-weight: 600;">Orgcue</span>
      <span style="font-size: 13px; color: var(--op-mut);">Lumio Inc.</span>
    </a>
    <span style="flex: 1; display: flex; justify-content: center; min-width: 0;"><x-import component-from-global-scope="OrgpulsDesignSystem_d91c81.Input" size="field" placeholder="Search everything" aria-label="Search everything" style="{{ searchW }}" hint-size="420px,38px"></x-import></span>
    <button type="button" aria-label="Help and notifications" onClick="{{ help }}" style="width: 36px; height: 36px; flex: none; cursor: pointer; border-radius: 999px; border: 1px solid var(--op-line); background: var(--op-sf); font-family: inherit; font-size: 14px; font-weight: 700; color: var(--op-ink);">?</button>
    <sc-if value="{{ canCreate }}"><x-import component-from-global-scope="OrgpulsDesignSystem_d91c81.Button" size="sm" onClick="{{ newProject }}" hint-size="140px,36px"><span style="white-space: nowrap;">＋ New project</span></x-import></sc-if>
    <span title="{{ meName }}" style="display: flex; width: 34px; height: 34px; flex: none; align-items: center; justify-content: center; border-radius: 999px; background: var(--op-ink); color: var(--op-bg); font-size: 12px; font-weight: 700;">{{ meIni }}</span>
  </header>
  <div style="flex: 1; display: flex; min-height: 0;">
    <aside style="{{ sideSt }}">
      <button type="button" onClick="{{ toggleNav }}" aria-label="{{ navToggleLabel }}" style="align-self: flex-start; height: 30px; min-width: 30px; cursor: pointer; border: 1px solid var(--op-line); border-radius: 8px; background: var(--op-sf); font-family: inherit; font-size: 14px; color: var(--op-ink);">{{ navToggle }}</button>
      <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 3px;">
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" aria-current="{{ n.aria }}" onClick="{{ n.on }}" title="{{ n.t }}" style="{{ n.st }}"><span aria-hidden="true" style="{{ n.tile }}">{{ n.icon }}</span><span style="{{ n.lst }}">{{ n.t }}</span></a>
        </sc-for>
      </nav>
      <span style="display: block; height: 1px; background: var(--op-line); margin: 4px 0;"></span>
      <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ true }}"><span style="padding: 0 10px; font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--op-mut);">Projects</span></sc-if>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <sc-for list="{{ projList }}" as="p" hint-placeholder-count="6">
          <a href="{{ p.href }}" onClick="{{ p.on }}" title="{{ p.name }}" style="{{ p.st }}"><span style="{{ p.sq }}"></span><sc-if value="{{ navOpen }}" hint-placeholder-val="{{ true }}"><span style="min-width: 0; flex: 1;"><span style="display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ p.name }}</span><span style="display: block; font-size: 11.5px; color: var(--op-mut);">{{ p.phase }}</span></span></sc-if></a>
        </sc-for>
      </div>
      <span style="margin-top: auto; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--op-line); padding: 12px 6px 0;">
        <span style="display: flex; width: 30px; height: 30px; flex: none; align-items: center; justify-content: center; border-radius: 999px; background: var(--op-ink); color: var(--op-bg); font-size: 11px; font-weight: 700;">{{ meIni }}</span>
        <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ true }}"><span style="min-width: 0; font-size: 12px; line-height: 1.4;"><span style="display: block; font-weight: 700; color: var(--op-ink);">{{ meName }}</span><span style="display: block; color: var(--op-mut);">Data region: US</span></span></sc-if>
      </span>
    </aside>
    <main style="flex: 1; min-width: 0; margin: 0 8px 8px 0; border: 1px solid var(--op-line); border-radius: 14px; background: var(--op-sf); padding: 22px 28px; box-sizing: border-box; animation: ht-in .25s ease;">
      <sc-if value="{{ isPages }}"><dc-import name="OcPages" path="{{ path }}" hint-size="100%,800px"></dc-import></sc-if>
      <sc-if value="{{ isProject }}"><dc-import name="OcProject" path="{{ path }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ isSettings }}"><dc-import name="OcSettings" path="{{ path }}" hint-size="100%,800px"></dc-import></sc-if>
      <sc-if value="{{ isPhone }}"><dc-import name="OcPhone" path="{{ path }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ isMissing }}"><div style="max-width: 560px; padding: 40px 0; display: flex; flex-direction: column; gap: 10px;"><span style="font-family: var(--font-display); font-size: 26px; font-weight: 600;">This page doesn’t exist.</span><span style="color: var(--op-mut);">{{ path }}</span><a href="#/home" onClick="{{ goHome }}">Go to Home →</a></div></sc-if>
    </main>
  </div>
  <dc-import name="OcWizard" hint-size="0px,0px"></dc-import>
  <sc-if value="{{ hasToast }}"><div role="status" style="position: fixed; z-index: 90; left: 50%; bottom: 24px; transform: translateX(-50%); border-radius: 12px; background: var(--op-ink); color: var(--op-bg); padding: 11px 18px; font-size: 13.5px; box-shadow: 0 18px 40px -24px rgba(25,21,16,.45);">{{ toast }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { path: this.read() };
  read() { const h = (location.hash || '').replace(/^#/, ''); return h.startsWith('/') ? h : '/home'; }
  componentDidMount() { this.onHash = () => { this.setState({ path: this.read() }); window.scrollTo(0, 0); }; window.addEventListener('hashchange', this.onHash); this.poll = setInterval(() => { if (window.OCK && window.OCD) { clearInterval(this.poll); this.un = window.OCK.sub(this); this.forceUpdate(); } }, 40); }
  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); clearInterval(this.poll); this.un && this.un(); }
  renderVals() {
    const K = window.OCK, D = window.OCD, path = this.state.path;
    if (!K || !D) return { path, roles: [], phases: [], navItems: [], projList: [], navOpen: true, sideSt: { width: 240 } };
    const S = K.S, c = S.navC, role = S.role;
    const seg = (sel) => ({ cursor: 'pointer', border: 'none', borderRadius: 7, padding: '4px 9px', fontFamily: 'inherit', fontSize: 12, fontWeight: sel ? 700 : 500, background: sel ? 'var(--op-ac)' : 'transparent', color: sel ? 'var(--op-ink)' : 'var(--op-bg)' });
    const me = D.people[K.who()];
    const top = path.split('/')[1] || 'home';
    const items = [['home', 'Home', '⌂', '/home'], ['projects', 'Projects', '▦', '/projects'], ['templates', 'Templates', '❐', '/templates'], ['library', 'Library', '▤', '/library'], ['portfolio', 'Portfolio', '▥', '/portfolio'], ['settings', 'Settings', '≡', '/settings']].filter((n) => !(n[0] === 'portfolio' && role === 'contributor'));
    const cur = top === 'p' ? 'projects' : top;
    const navItems = items.map(([k, t, icon, p]) => { const sel = k === cur; return { t, icon, href: '#' + p, aria: sel ? 'page' : undefined, on: K.nav(p),
      st: c ? { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, width: 52, padding: '6px 0', borderRadius: 10, textDecoration: 'none', color: sel ? 'var(--op-ink)' : 'var(--op-body)', background: sel ? 'var(--op-sbg)' : 'transparent' } : { display: 'flex', alignItems: 'center', gap: 10, padding: '7px 10px', borderRadius: 10, textDecoration: 'none', color: 'var(--op-ink)', background: sel ? 'var(--op-sbg)' : 'transparent', fontWeight: sel ? 700 : 500, fontSize: 14 },
      tile: { display: 'flex', width: 26, height: 26, flex: 'none', alignItems: 'center', justifyContent: 'center', borderRadius: 8, fontSize: 14, background: sel ? 'var(--op-ac)' : 'var(--op-track)' },
      lst: c ? { fontSize: 10, fontWeight: sel ? 700 : 500 } : { flex: 1 } }; });
    const pid = top === 'p' ? path.split('/')[2] : '';
    const projList = D.projects.map((p) => ({ name: p.name, phase: p.id === 'it-helpdesk' ? S.phase : p.phase, href: '#/p/' + p.id + '/overview', on: K.nav('/p/' + p.id + '/overview'),
      st: { display: 'flex', alignItems: 'center', gap: 9, padding: c ? '6px 0' : '6px 10px', justifyContent: c ? 'center' : 'flex-start', borderRadius: 10, textDecoration: 'none', color: 'var(--op-ink)', background: p.id === pid ? 'var(--op-sbg)' : 'transparent' },
      sq: { width: 14, height: 14, flex: 'none', borderRadius: 4, background: p.color, border: '1px solid var(--op-rule)', boxSizing: 'border-box' } }));
    const isPages = ['home', 'projects', 'templates', 'library', 'portfolio'].includes(top) && path.split('/').length <= 2;
    return {
      path, toast: S.toast, hasToast: !!S.toast,
      roles: [['owner', 'Owner'], ['decider', 'Decider'], ['contributor', 'Contributor'], ['admin', 'Org admin']].map(([k, t]) => ({ t, sel: role === k, st: seg(role === k), on: () => K.set({ role: k }) })),
      phases: K.PH.map((p) => ({ t: p, sel: S.phase === p, st: seg(S.phase === p), on: () => K.set({ phase: p }) })),
      all: S.all, toggleAll: () => K.set({ all: !S.all }),
      allTrack: { position: 'relative', width: 30, height: 17, borderRadius: 999, background: S.all ? 'var(--op-ac)' : 'rgba(252,246,233,.3)' }, allKnob: { position: 'absolute', top: 2, left: S.all ? 15 : 2, width: 13, height: 13, borderRadius: 999, background: 'var(--op-sf)', transition: 'left 150ms' },
      goPhone: K.nav('/phone'), goCustomer: K.nav('/customer'), goHome: K.nav('/home'), help: () => K.toast('2 new: Daniel asked about DEC-06 · A-016 waiting for Sam'),
      canCreate: role === 'owner' || role === 'admin', newProject: () => K.set({ wiz: { step: 0 } }), searchW: { width: '100%', maxWidth: 420 },
      meName: me.name, meIni: me.ini,
      navOpen: !c, navToggle: c ? '»' : '«', navToggleLabel: c ? 'Expand sidebar' : 'Collapse sidebar',
      toggleNav: () => { try { localStorage.setItem('orgcue-navC', JSON.stringify(!c)); } catch (e) {} K.set({ navC: !c }); },
      sideSt: { width: c ? 72 : 240, flex: 'none', boxSizing: 'border-box', display: 'flex', flexDirection: 'column', alignItems: c ? 'center' : 'stretch', gap: 8, padding: '6px 10px 14px', overflowX: 'hidden', overflowY: 'auto', transition: 'width 180ms ease-in-out', position: 'sticky', top: 0, maxHeight: '100vh' },
      navItems, projList, isPages, isProject: top === 'p', isSettings: top === 'settings', isPhone: top === 'phone' || top === 'customer', isMissing: !isPages && !['p', 'settings', 'phone', 'customer'].includes(top),
    };
  }
}
</script>
</body>
</html>
